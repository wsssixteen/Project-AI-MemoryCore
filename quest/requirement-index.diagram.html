<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requirement index · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tool · quest/requirement-index.js</p>
    <h1>Requirement index: narrow to the likely spec, then read it</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ri-title ri-desc">
      <title id="ri-title">Requirement index flow</title>
      <desc id="ri-desc">A ticket at Phase 0, or a question about a requirement, is checked for an alter, patch or cancel request; otherwise the index of Redmine requirements is searched, the top 3 likely requirements are listed, the chosen one is opened and compared with the ask, and a REQUIREMENT-MATCH verdict is written. The --load mode takes an urusan, tugasan, called flow and value words, collects up to 3 rows from each of five tiers in the order T2 called-flow kods, T5 value words, T3 integration, T4 cross-module, T1 urusan tree, prints one REQUIREMENT-LOAD block and names the reads: the urusan master by --section, then the top rows in full.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows (drawn first) -->
      <line x1="220" y1="152" x2="236" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="152" x2="436" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="310" y1="200" x2="310" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="530" y1="76" x2="530" y2="116" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="620" y1="152" x2="676" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="770" y1="184" x2="770" y2="276" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="680" y1="312" x2="634" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="390" y1="312" x2="426" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- --load arrows -->
      <polyline points="220,568 236,568 236,500 246,500" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <polyline points="620,48 940,48 940,476 866,476" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="220" y1="476" x2="246" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="530" y1="512" x2="530" y2="560" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="630" y1="588" x2="676" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <polyline points="860,588 960,588 960,312 864,312" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="394" y="126" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="408" y="136" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="320" y="234" width="32" height="14" rx="2" fill="#f5f5f5"/>
      <text x="336" y="244" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- 1 Ticket -->
      <rect x="40" y="120" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="130" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">A ticket at Phase 0</text>
      <text x="130" y="166" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">or: requirement for X?</text>

      <!-- 2 Request check -->
      <polygon points="310,104 380,152 310,200 240,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Alter, patch</text>
      <text x="310" y="163" fill="#2d3142" font-size="11" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">or cancel?</text>

      <!-- 3 Index store -->
      <rect x="440" y="20" width="180" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="530" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Requirement index</text>
      <text x="530" y="62" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">2,084 rows · weekly · kods</text>

      <!-- 4 Search -->
      <rect x="440" y="120" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="530" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Search the index</text>
      <text x="530" y="166" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">subject · kods · synonyms</text>

      <!-- 5 Top 3 -->
      <rect x="680" y="120" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="770" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Top 3 likely requirements</text>
      <text x="770" y="166" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">strong · possible · none</text>

      <!-- 6 Open and compare (focal) -->
      <rect x="680" y="280" width="180" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="770" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Open it, compare the ask</text>
      <text x="770" y="326" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">--read · --section</text>

      <!-- 7 Verdict -->
      <rect x="430" y="280" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="530" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">REQUIREMENT-MATCH</text>
      <text x="530" y="326" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">aligned · extends · contradicts</text>

      <!-- 8 Not needed -->
      <rect x="230" y="284" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="310" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Not needed</text>
      <text x="310" y="326" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">no spec to check</text>

      <!-- Divider + --load section -->
      <line x1="40" y1="392" x2="900" y2="392" stroke="#4f5d75" stroke-width="0.6" stroke-dasharray="2,4"/>
      <text x="40" y="414" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" letter-spacing="0.18em">--LOAD · WHAT THE URUSAN, TUGASAN AND CALLED FLOW CARRY</text>

      <!-- L1 Load input -->
      <rect x="40" y="444" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="130" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">--load</text>
      <text x="130" y="488" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">urusan · tugasan · called · words</text>

      <!-- L1b BPMN source -->
      <rect x="40" y="540" width="180" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="130" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Called BPMN</text>
      <text x="130" y="582" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">receiveUserTask kods</text>

      <!-- Tier row: rank order left to right -->
      <rect x="250" y="440" width="116" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">T2 called flow</text>
      <text x="308" y="484" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">its tugasan kods</text>
      <text x="308" y="498" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">SPI · SPIL · KP</text>

      <rect x="374" y="440" width="116" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">T5 value words</text>
      <text x="432" y="484" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">with synonyms</text>
      <text x="432" y="498" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">PTG≈PD · PDT≈PT</text>

      <rect x="498" y="440" width="116" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="556" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">T3 integration</text>
      <text x="556" y="484" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Integrasi &lt;urusan&gt;</text>
      <text x="556" y="498" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">+ no-parent rows</text>

      <rect x="622" y="440" width="116" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">T4 cross-module</text>
      <text x="680" y="484" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Integrasi … module</text>
      <text x="680" y="498" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">+ parent chain</text>

      <rect x="746" y="440" width="116" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="804" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">T1 urusan tree</text>
      <text x="804" y="484" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">master under 215975</text>
      <text x="804" y="498" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">+ tugasan children</text>

      <text x="556" y="432" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">RANK ORDER, LEFT FIRST · MAX 3 ROWS EACH</text>

      <!-- L3 Load block (focal) -->
      <rect x="430" y="564" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="530" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">REQUIREMENT-LOAD</text>
      <text x="530" y="606" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">one row per requirement · deduped</text>

      <!-- L4 Next reads -->
      <rect x="680" y="560" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="770" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Next: the reads</text>
      <text x="770" y="602" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">master --section · top 3 full</text>

      <!-- Callout -->
      <text x="40" y="646" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">A "Semua Urusan" hit is a right pointer: read the shared spec, then the urusan's own requirement. --cheap prints the block with no reads.</text>
    </svg>
    </div>
  </div>
</body>
</html>
