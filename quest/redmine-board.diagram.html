<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redmine board · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tool · quest/redmine-board.js</p>
    <h1>Ticket board: Melaka table, then Perak table, per category</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rb-title rb-desc">
      <title id="rb-title">Redmine board flow</title>
      <desc id="rb-desc">Redmine is read three ways: Melaka tickets of every assignee, every ticket assigned to him, and Ammar's tickets on Perak projects. Rows are split by tracker category and printed in order: Melaka PROD, Perak PROD, Melaka eSOKONGAN, Perak eSOKONGAN, Melaka rest, Perak rest, then any other state's single table.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows -->
      <line x1="250" y1="90" x2="326" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="250" y1="220" x2="326" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="250" y1="350" x2="326" y2="240" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="530" y1="220" x2="596" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Sources -->
      <rect x="40" y="60" width="210" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="145" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Melaka tickets</text>
      <text x="145" y="106" text-anchor="middle" font-size="12" fill="#4f5d75">every assignee</text>

      <rect x="40" y="190" width="210" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="145" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Assigned to you</text>
      <text x="145" y="236" text-anchor="middle" font-size="12" fill="#4f5d75">any project, any state</text>

      <rect x="40" y="320" width="210" height="60" rx="6" fill="#fbeae4" stroke="#bf4520" stroke-width="1.6"/>
      <text x="145" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#bf4520">Ammar on Perak</text>
      <text x="145" y="366" text-anchor="middle" font-size="12" fill="#4f5d75">shared filter (new 2026-10-30)</text>

      <!-- Split -->
      <rect x="330" y="180" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="430" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Split by tracker</text>
      <text x="430" y="234" text-anchor="middle" font-size="12" fill="#4f5d75">PROD · eSOKONGAN · rest</text>

      <!-- Output tables -->
      <g font-size="13">
        <rect x="600" y="40"  width="340" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="618" y="67" fill="#2d3142">1  Melaka PROD</text>
        <rect x="600" y="92"  width="340" height="44" rx="6" fill="#fbeae4" stroke="#bf4520" stroke-width="1.6"/>
        <text x="618" y="119" fill="#bf4520" font-weight="600">1b Perak PROD</text>
        <rect x="600" y="152" width="340" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="618" y="179" fill="#2d3142">2  Melaka eSOKONGAN</text>
        <rect x="600" y="204" width="340" height="44" rx="6" fill="#fbeae4" stroke="#bf4520" stroke-width="1.6"/>
        <text x="618" y="231" fill="#bf4520" font-weight="600">2b Perak eSOKONGAN</text>
        <rect x="600" y="264" width="340" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="618" y="291" fill="#2d3142">3  Melaka rest (tracker tier)</text>
        <rect x="600" y="316" width="340" height="44" rx="6" fill="#fbeae4" stroke="#bf4520" stroke-width="1.6"/>
        <text x="618" y="343" fill="#bf4520" font-weight="600">3b Perak rest (tracker tier)</text>
        <rect x="600" y="376" width="340" height="44" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="618" y="403" fill="#4f5d75">Other states: one table each</text>
      </g>
      <text x="600" y="450" font-size="12" fill="#4f5d75">Inside a table: priority, urgent, then due or age.</text>
    </svg>
    </div>
  </div>
</body>
</html>
