<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>place-file homes</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; }
.frame { width: 1000px; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
<h1>place-file: where a file he gives in a quest goes</h1>
<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pf-title pf-desc">
<title id="pf-title">place-file homes</title>
<desc id="pf-desc">A file from Downloads goes through place-file to the cycle folder, the Brief folder or the knowledge flow folder. The source is removed only after the bytes match.</desc>
<defs><marker id="pf-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="10" y="105" width="190" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="105" y="145" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">File he gives</text>
<text x="105" y="168" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">Downloads, Desktop</text>
<rect x="270" y="105" width="210" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="375" y="145" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">place-file</text>
<text x="375" y="168" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">Source removed once bytes match</text>
<rect x="590" y="10" width="400" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="790" y="44" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">His fixed copy: cycle folder</text>
<text x="790" y="67" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">2. Fix, or the latest N. Rework</text>
<rect x="590" y="110" width="400" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="790" y="144" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">BA or user evidence: latest Brief</text>
<text x="790" y="167" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">1. Brief, or the N. Rework Brief</text>
<rect x="590" y="210" width="400" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="790" y="244" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Reference flow model: etanah-knowledge</text>
<text x="790" y="267" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">State read from the model key; old copy kept</text>
<line x1="200" y1="150" x2="268" y2="150" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#pf-a)"/>
<path d="M 480,150 H 535 V 50 H 588" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#pf-a)"/>
<line x1="480" y1="150" x2="588" y2="150" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#pf-a)"/>
<path d="M 480,150 H 535 V 250 H 588" fill="none" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#pf-a)"/>
</svg>
</div>
</body>
</html>
