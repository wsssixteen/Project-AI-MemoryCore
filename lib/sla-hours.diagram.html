<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How one ticket gets its Hours left number</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Segoe UI', Arial, sans-serif; }
  .frame { width: 1000px; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
  h1 { font-size: 22px; font-weight: 600; color: #2d3142; margin-bottom: 16px; }
  svg { width: 1000px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <h1>How one ticket gets its Hours left number</h1>
  <svg viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sla-hours-title sla-hours-desc">
    <title id="sla-hours-title">How one ticket gets its Hours left number</title>
    <desc id="sla-hours-desc">Priority gives the limit, the timer counts hours since the ticket reached him, the difference is printed on the board.</desc>
    <defs><marker id="sla-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
    <line x1="290" y1="70" x2="348" y2="70" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sla-a)"/>
    <line x1="650" y1="70" x2="708" y2="70" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sla-a)"/>
    <rect x="1" y="20" width="288" height="100" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="145" y="52" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">Limit by priority</text>
    <text x="145" y="78" fill="#4f5d75" font-size="13" text-anchor="middle">Critical 6 · High 10</text>
    <text x="145" y="98" fill="#4f5d75" font-size="13" text-anchor="middle">Medium 22 · Low 31</text>
    <rect x="350" y="20" width="298" height="100" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="499" y="52" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">Minus timer hours since it reached him</text>
    <text x="499" y="78" fill="#4f5d75" font-size="13" text-anchor="middle">8am to 5pm, public holidays out</text>
    <text x="499" y="98" fill="#4f5d75" font-size="13" text-anchor="middle">Terengganu Sunday to Thursday</text>
    <rect x="710" y="20" width="288" height="100" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1.6"/>
    <text x="854" y="52" fill="#bf4520" font-size="15" font-weight="600" text-anchor="middle">Hours left on the board</text>
    <text x="854" y="78" fill="#4f5d75" font-size="13" text-anchor="middle">A bare number; negative is over</text>
    <text x="854" y="98" fill="#4f5d75" font-size="13" text-anchor="middle">Dash when not eSOKONGAN tracker</text>
  </svg>
</div>
</body>
</html>
