<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requirement index · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tool · lib/diagram-census.js</p>
    <h1>Every part ships with its own diagram</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dc-title dc-desc">
      <title id="dc-title">Diagram at birth flow</title>
      <desc id="dc-desc">A part is built or refined, its diagram is drawn as HTML, rendered to a PNG, checked by diagram-census, and committed beside the part in git; the census lists every part still missing one.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <line x1="180" y1="100" x2="216" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="100" x2="416" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="100" x2="616" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="780" y1="100" x2="816" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 700,132 V 220 H 508 Q 500,220 500,212 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="610" y="206" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="638" y="216" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">FAIL</text>
      <rect x="784" y="74" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="798" y="84" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">OK</text>

      <rect x="20" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">A part is built</text>
      <text x="100" y="114" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">Feature · Skill · Tool</text>

      <rect x="220" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Draw the diagram</text>
      <text x="300" y="114" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">explain-diagram skill</text>

      <rect x="420" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Render the PNG</text>
      <text x="500" y="114" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">lib/diagram-render.js</text>

      <rect x="620" y="68" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="700" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Check it</text>
      <text x="700" y="114" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">diagram-census --check</text>

      <rect x="820" y="68" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Commit beside it</text>
      <text x="900" y="114" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">diagram.html + .png</text>

      <rect x="20" y="240" width="300" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="170" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Census lists parts with none</text>
      <text x="170" y="282" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">node lib/diagram-census.js --missing</text>

      <text x="360" y="300" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">A new Feature README must also name it: diagram: (birth gate blocks without).</text>
    </svg>
    </div>
  </div>
</body>
</html>
