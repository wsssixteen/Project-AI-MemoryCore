<body><div class="frame"><p class="eyebrow">lib/handover-check.js · run at handover step 4</p><h1>The hand-over check, with the note code check added</h1><div class="diagram-container"><svg viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">handover-check flow</title><desc id="d">Four steps, the third added on 2026-11-24.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="246" y1="115" x2="264" y2="115" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="491" y1="115" x2="509" y2="115" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="736" y1="115" x2="754" y2="115" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="20" y="60" width="225" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="132.5" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1. Read the inputs</text><text x="132.5" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">note, ticket, fix files</text><text x="132.5" y="144" fill="#4f5d75" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Brief folder and Fix folders</text><rect x="265" y="60" width="225" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="377.5" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2. Expected rows</text><text x="377.5" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row words in the ticket</text><text x="377.5" y="144" fill="#4f5d75" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">line numbers have file, branch</text><rect x="510" y="60" width="225" height="110" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/><text x="622.5" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3. Note code</text><text x="622.5" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prints NOTE-CODE: n/n</text><text x="622.5" y="144" fill="#bf4520" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ADDED: whole lines of fix file</text><rect x="755" y="60" width="225" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="867.5" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4. Verdict</text><text x="867.5" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HANDOVER-CHECK: n finding(s)</text><text x="867.5" y="144" fill="#4f5d75" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the gate blocks on a finding</text></svg></div></div></body></html>
