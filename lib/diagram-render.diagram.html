<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diagram-render · how a picture gets out</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#f5f5f5; color:#2d3142; display:flex; justify-content:center; padding:1rem; }
    .frame { width: 1000px; padding: 28px 32px; box-sizing: content-box; background:#f5f5f5; }
    .eyebrow { font-family: Consolas, monospace; font-size:0.75rem; letter-spacing:0.18em; text-transform:uppercase; color:#4f5d75; margin-bottom:0.4rem; }
    h1 { font-size:1.6rem; font-weight:600; margin-bottom:1rem; }
    svg { width:100%; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tool · lib/diagram-render.js</p>
    <h1>How a picture gets out: two checks, no bypass</h1>
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">How a picture gets out: two checks, no bypass</title>
      <desc id="d">A page copied from a diagram-design example passes the self-check, then the box-text check, then renders to a PNG that is read and sent. Any FAIL goes back to fixing the page.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows -->
      <line x1="160" y1="84" x2="218" y2="84" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="400" y1="84" x2="458" y2="84" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="640" y1="84" x2="698" y2="84" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="860" y1="112" x2="860" y2="158" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="310" y1="130" x2="310" y2="258" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="550" y1="130" x2="550" y2="258" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 250,300 H 90 V 112" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <text x="189" y="74" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">run</text>
      <text x="429" y="74" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">PASS</text>
      <text x="669" y="74" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">PASS</text>
      <text x="322" y="200" fill="#bf4520" font-size="11" font-family="Consolas, monospace">FAIL</text>
      <text x="562" y="200" fill="#bf4520" font-size="11" font-family="Consolas, monospace">FAIL</text>
      <text x="100" y="230" fill="#bf4520" font-size="11" font-family="Consolas, monospace">fix the page</text>

      <!-- nodes -->
      <rect x="20" y="56" width="140" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="90" y="80" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Page</text>
      <text x="90" y="98" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">example-&lt;type&gt;.html</text>

      <polygon points="310,38 400,84 310,130 220,84" fill="#ffffff" stroke="#2d3142"/>
      <text x="310" y="80" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Self-check</text>
      <text x="310" y="97" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">real SVG?</text>

      <polygon points="550,38 640,84 550,130 460,84" fill="#ffffff" stroke="#2d3142"/>
      <text x="550" y="80" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Box text</text>
      <text x="550" y="97" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">≤ 60 chars?</text>

      <rect x="700" y="56" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="840" y="80" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">PNG rendered</text>
      <text x="840" y="98" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">DIAGRAM-RENDER: OK</text>

      <rect x="740" y="160" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="860" y="184" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Read it, then send</text>
      <text x="860" y="202" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">SendUserFile</text>

      <rect x="250" y="260" width="360" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
      <text x="430" y="290" fill="#bf4520" font-size="14" font-weight="600" text-anchor="middle">FAIL: no PNG</text>
      <text x="430" y="312" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">no flag skips a check</text>
      <text x="430" y="328" fill="#4f5d75" font-size="11" text-anchor="middle" font-family="Consolas, monospace">removed 2026-11-17 (254267)</text>
    </svg>
  </div>
</body>
</html>
