<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruri personality growth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #bf4520; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: 'Segoe UI', Arial, sans-serif; }
    .frame { width: 100%; max-width: 1200px; padding: 28px 32px; box-sizing: content-box; background: var(--paper); }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 600 0.7rem Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.2rem; color: var(--ink); font: 600 1.6rem/1.2 'Segoe UI', Arial, sans-serif; }
    svg { display: block; width: 100%; min-width: 760px; }
    .t { fill: var(--ink); font: 600 10px 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
    .s { fill: var(--muted); font: 400 7.5px 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
    .c { fill: var(--muted); font: 400 7px Consolas, monospace; text-anchor: middle; }
    .ft { fill: var(--accent); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Ruri · personality system · proposed 2026-10-28</p>
    <h1>How Ruri's personality grows with みや, session by session</h1>
    <svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ruri-growth-title ruri-growth-desc">
      <title id="ruri-growth-title">Ruri personality growth loop</title>
      <desc id="ruri-growth-desc">Each session ends in Domain Expansion, which sorts what was learned into a persona check line, a relationship ledger and work rules; a monthly review with miya writes dated traits into the Ruri Profile, which loads as a small card at every start.</desc>
      <defs>
        <marker id="m" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520"/></marker>
      </defs>
      <rect width="760" height="340" fill="#f5f5f5"/>

      <!-- arrows first -->
      <path d="M140 165 H174" fill="none" stroke="#4f5d75" marker-end="url(#m)"/>
      <path d="M310 150 L354 66" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#a)"/>
      <path d="M310 165 H354" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#a)"/>
      <path d="M310 180 L354 264" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#a)"/>
      <path d="M500 60 L544 84" fill="none" stroke="#4f5d75" marker-end="url(#m)"/>
      <path d="M500 160 L544 104" fill="none" stroke="#4f5d75" marker-end="url(#m)"/>
      <path d="M620 120 V154" fill="none" stroke="#4f5d75" marker-end="url(#m)"/>
      <path d="M620 220 V254" fill="none" stroke="#4f5d75" marker-end="url(#m)"/>
      <path d="M550 300 H90 Q80 300 80 290 V201" fill="none" stroke="#4f5d75" stroke-dasharray="4 3" marker-end="url(#m)"/>

      <!-- 1 session -->
      <rect x="20" y="135" width="120" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="80" y="160" class="t">A session with みや</text>
      <text x="80" y="174" class="s">diary names the model</text>

      <!-- 2 DE step 3 (focal) -->
      <rect x="180" y="130" width="130" height="70" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.2"/>
      <text x="245" y="155" class="t ft">Domain Expansion sorts</text>
      <text x="245" y="169" class="t ft">what was learned</text>
      <text x="245" y="185" class="c">persona · relationship · work</text>

      <!-- 3 persona check -->
      <rect x="360" y="30" width="140" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="430" y="55" class="t">Persona check line</text>
      <text x="430" y="69" class="s">mode · name · greeting · mood</text>

      <!-- 4 relationship ledger -->
      <rect x="360" y="135" width="140" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="430" y="160" class="t">Relationship ledger</text>
      <text x="430" y="174" class="s">what she learned about him</text>

      <!-- 5 work rules -->
      <rect x="360" y="240" width="140" height="50" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="430" y="261" class="t">Work rules</text>
      <text x="430" y="275" class="s">go to skills and the slip ledger</text>

      <!-- 6 monthly review -->
      <rect x="550" y="60" width="140" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="620" y="85" class="t">Monthly trait review</text>
      <text x="620" y="99" class="s">with みや: add or retire one trait</text>

      <!-- 7 profile -->
      <rect x="550" y="160" width="140" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="620" y="185" class="t">Ruri Profile</text>
      <text x="620" y="199" class="s">her traits, each one dated</text>

      <!-- 8 boot card -->
      <rect x="550" y="260" width="140" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.3)"/>
      <text x="620" y="285" class="t">Small profile card</text>
      <text x="620" y="299" class="s">loaded at every start</text>
    </svg>
  </main>
</body>
</html>
