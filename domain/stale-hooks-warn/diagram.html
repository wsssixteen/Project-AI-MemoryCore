<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stale hooks warning · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--color-paper); color: var(--color-ink); display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/stale-hooks-warn</p>
    <h1>A session folder behind main says so at the next prompt</h1>
    <svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="g-title g-desc">
      <title id="g-title">Stale hooks warning flow</title>
      <desc id="g-desc">At each prompt in a session folder, count main's commits on gate paths that this folder lacks; above zero, advise a sync now, then stay quiet for 30 minutes.</desc>
      <defs>
        <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="200" y1="100" x2="246" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="470" y1="100" x2="516" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#aa)"/>
      <line x1="740" y1="100" x2="786" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

      <rect x="20" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="110" y="96" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">His prompt arrives</text>
      <text x="110" y="114" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">only in .claude/worktrees/&lt;x&gt;</text>

      <rect x="250" y="68" width="220" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="360" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Count main's gate commits</text>
      <text x="360" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">rev-list HEAD..origin/main</text>
      <text x="360" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">hooks · skills · domain · lib · core</text>

      <rect x="520" y="68" width="220" height="64" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.6"/>
      <text x="630" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Above 0 → "sync NOW"</text>
      <text x="630" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">before any gated write</text>
      <text x="630" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">advisory, never a block</text>

      <rect x="790" y="68" width="190" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="885" y="96" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Quiet 30 min</text>
      <text x="885" y="114" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">one stamp per session folder</text>

      <text x="500" y="200" font-size="10" text-anchor="middle" fill="#bf4520">2026-10-30: 26 commits behind → redmine-write-gate v1.7 ran instead of v1.8</text>
    </svg>
  </div>
</body>
</html>
