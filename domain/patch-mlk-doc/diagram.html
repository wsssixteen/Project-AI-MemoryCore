<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>patch-mlk-doc: patching a stored letter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; min-width: 0; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/patch-mlk-doc</p>
    <h1>patch-mlk-doc: patching a stored letter</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
        <title id="t">patch-mlk-doc: patching a stored letter</title>
        <desc id="d">Locate the file, infra download, edit to the system layout, render, letter-check STANDARD ALIGNMENT DATA, deliverable-check, infra replace and reset PDF.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="10" y="40" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="95" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">1. Locate</text>
        <text x="95" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">lokasi_fail · revision</text>

        <line x1="180" y1="80" x2="208" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="210" y="40" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="295" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">2. Download</text>
        <text x="295" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">infra · original kept</text>

        <line x1="380" y1="80" x2="408" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="410" y="40" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">3. Edit</text>
        <text x="500" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">system layout · real values</text>

        <line x1="590" y1="80" x2="618" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="620" y="40" width="150" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="695" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">4. Render</text>
        <text x="695" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">Word → PDF</text>

        <line x1="770" y1="80" x2="798" y2="80" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="800" y="20" width="190" height="120" rx="6" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.6"/>
        <text x="895" y="48" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">5. letter-check</text>
        <text x="895" y="74" fill="#bf4520" font-size="12" font-family="Consolas" text-anchor="middle">STANDARD</text>
        <text x="895" y="96" fill="#bf4520" font-size="12" font-family="Consolas" text-anchor="middle">ALIGNMENT</text>
        <text x="895" y="118" fill="#bf4520" font-size="12" font-family="Consolas" text-anchor="middle">DATA</text>

        <line x1="895" y1="140" x2="895" y2="198" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="885" y="166" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="end">PASS</text>
        <text x="885" y="182" fill="#bf4520" font-size="11" font-family="Consolas" text-anchor="end">FAIL → back to 3</text>

        <rect x="800" y="200" width="190" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="895" y="232" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">6. deliverable-check</text>
        <text x="895" y="254" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">2. Fix · &lt;num&gt;.sql</text>
        <text x="895" y="270" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">2+ files → &lt;num&gt;.zip</text>

        <line x1="800" y1="240" x2="702" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="470" y="200" width="230" height="80" rx="22" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
        <text x="585" y="232" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">7. Infra</text>
        <text x="585" y="254" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">upload file or zip → reset PDF</text>
      </svg>
    </div>
  </div>
</body>
</html>
