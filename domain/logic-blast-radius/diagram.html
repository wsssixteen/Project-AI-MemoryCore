<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrival paths gate</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
.frame { max-width: 1000px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
.eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.4rem; }
h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Feature · domain/logic-blast-radius · v3</p>
<h1>A state check on a tugasan: every way the permohonan can arrive must be proven first</h1>
<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ap-t ap-d">
<title id="ap-t">Arrival paths gate flow</title>
<desc id="ap-d">The script reads the running flowable from the engine database and lists the paths. The quest doc proves each one. The edit gate checks every path has a row. A failed row becomes a ledger row that blocks the commit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="220" y1="72" x2="248" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="470" y1="72" x2="498" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="720" y1="72" x2="748" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="860" y1="112" x2="860" y2="178" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="750" y1="218" x2="722" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="20" y="32" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="120" y="60" font-size="13" font-weight="600" text-anchor="middle">Flowable lists the paths</text>
<text x="120" y="80" fill="#4f5d75" font-size="11" text-anchor="middle">arrival-paths.js, engine DB</text>
<text x="120" y="96" fill="#4f5d75" font-size="11" text-anchor="middle">local BPMN only as stale fallback</text>

<rect x="252" y="32" width="218" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="361" y="60" font-size="13" font-weight="600" text-anchor="middle">Quest doc proves each path</text>
<text x="361" y="80" fill="#4f5d75" font-size="11" text-anchor="middle">## Arrival paths: a SELECT per row</text>
<text x="361" y="96" fill="#4f5d75" font-size="11" text-anchor="middle">verdict ✓ ✗ BA-Q</text>

<rect x="502" y="26" width="218" height="92" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
<text x="611" y="54" font-size="13" font-weight="600" text-anchor="middle">Edit gate on the state check</text>
<text x="611" y="74" fill="#bf4520" font-size="11" text-anchor="middle">every listed path has a row,</text>
<text x="611" y="90" fill="#bf4520" font-size="11" text-anchor="middle">same source, active ticket,</text>
<text x="611" y="106" fill="#bf4520" font-size="11" text-anchor="middle">shared code: every urusan</text>

<rect x="752" y="32" width="216" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="860" y="60" font-size="13" font-weight="600" text-anchor="middle">Code edit allowed</text>
<text x="860" y="80" fill="#4f5d75" font-size="11" text-anchor="middle">Pembetulan, Alter, Initiate</text>
<text x="860" y="96" fill="#4f5d75" font-size="11" text-anchor="middle">all covered before the change</text>

<rect x="752" y="182" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="860" y="210" font-size="13" font-weight="600" text-anchor="middle">Commit gate</text>
<text x="860" y="230" fill="#4f5d75" font-size="11" text-anchor="middle">falsifier ledger, arrival rows</text>

<rect x="502" y="182" width="218" height="72" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="611" y="210" font-size="13" font-weight="600" text-anchor="middle">✗ or BA-Q row with no</text>
<text x="611" y="230" font-size="13" font-weight="600" text-anchor="middle">ledger row: commit blocked</text>
</svg>
</div>
</body>
</html>
