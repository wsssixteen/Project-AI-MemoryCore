<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hook correction reply</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
    body { font-family:'Segoe UI', Arial, sans-serif; background:var(--color-paper); color:var(--color-ink); display:flex; justify-content:center; padding:2rem; }
    .frame { max-width:1000px; width:100%; min-width:0; padding:28px 32px; box-sizing:content-box; }
    .diagram-container { width:100%; overflow-x:auto; }
    h1 { font-size:1.4rem; font-weight:600; margin-bottom:1rem; }
    svg { width:100%; min-width:800px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>A hook correction reply: the one changed step</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
        <title id="t">Hook correction reply</title>
        <desc id="d">A stop hook blocks a reply, I send only the missing piece, and that piece now also says what it means and the next step.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <line x1="260" y1="85" x2="318" y2="85" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="570" y1="85" x2="628" y2="85" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="20" y="40" width="240" height="90" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="140" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Stop hook blocks my reply</text>
        <text x="140" y="102" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">No change</text>
        <rect x="320" y="40" width="250" height="90" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="445" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">I send only the missing piece</text>
        <text x="445" y="102" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">No change: never repeat the reply</text>
        <rect x="630" y="40" width="250" height="90" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="755" y="80" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Ends on what it means + next step</text>
        <text x="755" y="102" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">New: a bare fact is banned</text>
      </svg>
    </div>
  </div>
</body>
</html>
