<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>terse-gate · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; padding: 2rem; }
    .frame { width: 1040px; padding: 28px 32px; box-sizing: content-box; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>terse-gate: what stops a reply too long to read</h1>
    <svg viewBox="0 0 1040 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terse-gate checks">
      <defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="172" y1="48" x2="196" y2="48" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="372" y1="48" x2="396" y2="48" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="572" y1="48" x2="596" y2="48" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="772" y1="48" x2="796" y2="48" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <rect x="4" y="20" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="88" y="44" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142" font-family="'Segoe UI', Arial">Reply ends</text>
      <text x="88" y="62" font-size="11" text-anchor="middle" fill="#4f5d75" font-family="'Segoe UI', Arial">reads his last message</text>
      <rect x="196" y="20" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="284" y="44" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142" font-family="'Segoe UI', Arial">Ticket hashtag</text>
      <text x="284" y="62" font-size="11" text-anchor="middle" fill="#4f5d75" font-family="'Segoe UI', Arial">any length</text>
      <rect x="396" y="20" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="484" y="44" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142" font-family="'Segoe UI', Arial">Short question</text>
      <text x="484" y="62" font-size="11" text-anchor="middle" fill="#4f5d75" font-family="'Segoe UI', Arial">cap 15 lines</text>
      <rect x="596" y="20" width="176" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
      <text x="684" y="44" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142" font-family="'Segoe UI', Arial">No oversharing</text>
      <text x="684" y="62" font-size="11" text-anchor="middle" fill="#4f5d75" font-family="'Segoe UI', Arial">cap 20 unless asked</text>
      <rect x="796" y="20" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="884" y="44" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142" font-family="'Segoe UI', Arial">Prose wall</text>
      <text x="884" y="62" font-size="11" text-anchor="middle" fill="#4f5d75" font-family="'Segoe UI', Arial">6 long lines</text>
      <text x="4" y="112" font-size="12" fill="#4f5d75" font-family="'Segoe UI', Arial">Any check fires: the reply is blocked and the fix is sent as a short follow-up. A second stop passes, so it never blocks twice.</text>
    </svg>
  </div>
</body>
</html>
