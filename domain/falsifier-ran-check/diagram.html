<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No etanah fix is committed while a written falsifier is unrun · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/falsifier-ran-check</p>
    <h1>No etanah fix is committed while a written falsifier is unrun</h1>
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-title d-desc">
      <title id="d-title">No etanah fix is committed while a written falsifier is unrun</title>
      <desc id="d-desc">An etanah git commit runs check.js through compile-gate. It reads the quest doc's Falsifier ledger (an OPEN row blocks; RAN and ACCEPTED-RISK pass), compares the staged files with the Fix files line, then checks the local test: active.txt says true, or miya waived it in his own words, read by lib/his-words up to eight messages back. Any failure blocks the commit with one line per cause and no skip token; a pass is logged and his waiver is kept 72 hours for the BA note. A Stop advisory separately flags a probe claimed planted but never shown firing.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
      <line x1="190" y1="92" x2="228" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="410" y1="92" x2="448" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="620" y1="92" x2="658" y2="92" stroke="#bf4520" stroke-width="1.4" marker-end="url(#aa)"/>
      <line x1="770" y1="124" x2="770" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <rect x="779.5" y="150" width="41" height="14" rx="2" fill="#f5f5f5"/>
      <text x="800" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">clear</text>
      <line x1="690" y1="124" x2="560" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <rect x="570.2" y="140" width="59.6" height="14" rx="2" fill="#f5f5f5"/>
      <text x="600" y="150" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">any fail</text>
      <line x1="770" y1="246" x2="770" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <rect x="20" y="60" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="105" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">etanah git commit</text>
      <text x="105" y="104" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">compile-gate calls check.js</text>
      <rect x="230" y="60" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Falsifier ledger rows</text>
      <text x="320" y="104" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">OPEN blocks · RAN, ACCEPTED pass</text>
      <rect x="450" y="60" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="535" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Fix files vs staged</text>
      <text x="535" y="104" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">a staged file off the line = drift</text>
      <rect x="660" y="60" width="220" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
      <text x="770" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Local test or his waiver</text>
      <text x="770" y="98" fill="#bf4520" font-size="9" font-family="Consolas, monospace" text-anchor="middle">active.txt true, or his plain words</text>
      <text x="770" y="111" fill="#bf4520" font-size="9" font-family="Consolas, monospace" text-anchor="middle">lib/his-words, 8 messages back</text>
      <rect x="660" y="190" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="770" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Commit runs</text>
      <text x="770" y="230" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">log.jsonl pass</text>
      <rect x="390" y="190" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Commit blocked</text>
      <text x="490" y="230" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">one line per cause · no skip token</text>
      <rect x="660" y="290" width="220" height="56" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="770" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">overrides.jsonl</text>
      <text x="770" y="330" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">his waiver kept 72 h for the BA note</text>
      <rect x="20" y="190" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="130" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Stop advisory</text>
      <text x="130" y="228" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">a probe claimed planted</text>
      <text x="130" y="241" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">but never shown firing</text>
      <text x="40" y="382" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">close-phase Phase 1 and the BA pass note run the same check.js.</text>
    </svg>
  </div>
</body>
