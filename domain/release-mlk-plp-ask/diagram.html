<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release ask · state check</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Segoe UI', Arial, sans-serif; --font-mono: Consolas, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · release-mlk-plp-ask · runs on every prompt</p>
    <h1>A release message names its state before the Melaka release pipeline is suggested</h1>
    <svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Release ask with the state check</title>
      <desc id="d">His prompt, the release words match, the new state check, then either the Melaka pipeline or the other state's main branch.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3142">
        <rect x="20" y="120" width="150" height="70" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="95" y="150" text-anchor="middle" font-weight="600">His prompt</text>
        <text x="95" y="170" text-anchor="middle" font-size="12" fill="#4f5d75">"Planned Release PERAK"</text>

        <rect x="210" y="120" width="170" height="70" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="295" y="150" text-anchor="middle" font-weight="600">Release words match</text>
        <text x="295" y="170" text-anchor="middle" font-size="12" fill="#4f5d75">release · baseline · deploy</text>

        <rect x="420" y="110" width="190" height="90" rx="6" fill="#fbeee8" stroke="#bf4520" stroke-width="2"/>
        <text x="515" y="140" text-anchor="middle" font-weight="600">NEW: which state?</text>
        <text x="515" y="160" text-anchor="middle" font-size="12" fill="#bf4520">state names from</text>
        <text x="515" y="176" text-anchor="middle" font-size="12" fill="#bf4520">system/states.json</text>

        <rect x="660" y="30" width="320" height="80" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="820" y="60" text-anchor="middle" font-weight="600">Melaka or no state named</text>
        <text x="820" y="82" text-anchor="middle" font-size="12" fill="#4f5d75">run the release-mlk-plp skill (unchanged)</text>

        <rect x="660" y="200" width="320" height="90" rx="6" fill="#fbeee8" stroke="#bf4520" stroke-width="2"/>
        <text x="820" y="228" text-anchor="middle" font-weight="600">Another state (Perak, Selangor ...)</text>
        <text x="820" y="250" text-anchor="middle" font-size="12" fill="#bf4520">Melaka pipeline does not apply</text>
        <text x="820" y="268" text-anchor="middle" font-size="12" fill="#bf4520">Perak main branch = master</text>

        <g stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" fill="none">
          <line x1="170" y1="155" x2="208" y2="155"/>
          <line x1="380" y1="155" x2="418" y2="155"/>
          <path d="M610 140 L635 140 L635 70 L658 70"/>
          <path d="M610 170 L635 170 L635 245 L658 245"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
