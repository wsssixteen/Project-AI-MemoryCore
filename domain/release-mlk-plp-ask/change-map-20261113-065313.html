<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release ask reads the state first</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    .pt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 8.5px; font-weight: 700; fill: #fff; letter-spacing: 0.06em; }
    .name { font-family: Consolas, monospace; font-size: 11px; fill: #2d3142; font-weight: 600; }
    .dir { font-family: Consolas, monospace; font-size: 9.5px; fill: #5a6580; }
    .what { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #4f5d75; }
    .kind { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">planned: a non-Melaka release message no longer points at the Melaka pipeline</p>
    <h1>Release ask reads the state first</h1>
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Release ask reads the state first</title>
      <desc id="d">Each kind box of the system map lists the parts changed, tagged new, changed or removed, with the folder each lives in.</desc>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="20" y="4" width="54" height="16" rx="8" fill="#2f7d4f"/><text x="47" y="15" text-anchor="middle" class="pt">NEW</text><rect x="84" y="4" width="70" height="16" rx="8" fill="#2e5aa8"/><text x="119" y="15" text-anchor="middle" class="pt">CHANGED</text><rect x="164" y="4" width="70" height="16" rx="8" fill="#bf4520"/><text x="199" y="15" text-anchor="middle" class="pt">REMOVED</text><text x="246" y="16" class="what">faded box = no change</text>
      <rect x="20" y="34" width="960" height="62" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="40" y="60" class="kind" fill="rgba(45,49,66,0.35)">Rules</text><text x="40" y="80" class="what" fill-opacity="0.6">no change</text><rect x="20" y="116" width="320" height="200" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="36" y="142" class="kind" fill="rgba(45,49,66,0.35)">Memory</text><text x="36" y="162" class="what" fill-opacity="0.6">no change</text><rect x="356" y="116" width="624" height="200" rx="6" fill="none" stroke="#4f5d75" stroke-dasharray="5 4"/><rect x="370" y="130" width="170" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="386" y="156" class="kind" fill="rgba(45,49,66,0.35)">Workflows</text><text x="386" y="176" class="what" fill-opacity="0.6">no change</text><rect x="552" y="130" width="262" height="172" rx="6" fill="rgba(94,122,155,0.12)" stroke="#5e7a9b" stroke-width="1.4"/><text x="568" y="156" class="kind" fill="#3d5876">Features</text><rect x="568" y="170" width="70" height="16" rx="8" fill="#2e5aa8"/><text x="603" y="181" text-anchor="middle" class="pt">CHANGED</text><text x="568" y="204" class="name">release-mlk-plp-ask</text><text x="568" y="219" class="dir">domain/release-mlk-plp-ask/</text><text x="568" y="236" class="what">names the state; another state gets its</text><text x="568" y="251" class="what">own main branch, not the Melaka pipeline</text><rect x="826" y="130" width="140" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="842" y="156" class="kind" fill="rgba(45,49,66,0.35)">Tools</text><text x="842" y="176" class="what" fill-opacity="0.6">no change</text><rect x="20" y="336" width="960" height="62" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="40" y="362" class="kind" fill="rgba(45,49,66,0.35)">Kernel</text><text x="40" y="382" class="what" fill-opacity="0.6">no change</text><rect x="20" y="418" width="960" height="62" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.2)"/><text x="40" y="444" class="kind" fill="rgba(45,49,66,0.35)">Projects</text><text x="40" y="464" class="what" fill-opacity="0.6">no change</text>
    </svg>
  </div>
</body>
</html>
