<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapis Lazuli Observatory</title>
<meta name="description" content="Every component of the Lapis Lazuli project with its registration, eval, liveness and gaps, plus the stray files no component owns.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('lapis-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Lapis Lazuli Observatory</h1>
      <p id="meta" class="meta">Loading snapshot…</p>
    </div>
  </div>
  <div class="controls">
    <label><span class="sr">Liveness window</span>
      <select id="days" aria-label="Liveness window">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
    </label>
    <button id="refresh" type="button">Refresh</button>
    <button id="theme" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>
<nav id="tabs" class="tabs" aria-label="Views">
  <a href="#overview">Overview</a>
  <a href="#findings">Findings</a>
  <a href="#catalog">Catalog</a>
  <a href="#runtime">Runtime</a>
  <a href="#monitoring">Monitoring</a>
  <a href="#mistakes">Mistakes</a>
  <a href="#evals">Evals</a>
  <a href="#quests">Quests</a>
  <a href="#memory">Memory</a>
  <a href="#unmanaged">Unmanaged</a>
  <a href="#sources">Sources</a>
</nav>
<main><section id="view" aria-live="polite"></section></main>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Component detail">
  <div class="drawer-inner">
    <button id="drawer-close" class="close" type="button">Close</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div id="tip" class="tip" role="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
