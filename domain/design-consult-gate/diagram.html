      <desc id="d-desc">An Edit or Write on a skill, hook, rule or system file is caught before it runs. The gate checks that both system-rules and system-design were loaded this session, that a new hook has an eval beside it, and, new on 2026-10-29, that the written code does not parse transcript user lines itself instead of requiring lib/his-words.js. A missing consult or an own reader denies the edit with one line naming what unblocks it; a missing /system-change load is an advisory. A Stop side judges a build proposal for a UNIVERSAL line.</desc>
