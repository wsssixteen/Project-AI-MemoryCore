<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweep audit script</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Segoe UI', Arial, sans-serif;
      --font-mono:     Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · /sweep close</p>
    <h1>The audit script at sweep close: what it reads, what it writes</h1>

    <svg viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Sweep audit script: inputs and outputs</title>
      <desc id="d">Two inputs, the familiar transcripts and the hook log, feed the audit script. It writes one ledger row and a defect list shown at close.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows in -->
      <line x1="300" y1="92" x2="418" y2="138" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="212" x2="418" y2="166" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Arrows out -->
      <line x1="660" y1="138" x2="778" y2="92" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="660" y1="166" x2="778" y2="212" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Inputs -->
      <rect x="40" y="60" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="170" y="87" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Familiar transcripts</text>
      <text x="170" y="106" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">one file per familiar, kept on disk</text>

      <rect x="40" y="180" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="170" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Hook log</text>
      <text x="170" y="226" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">which gates stood down in the sweep</text>

      <!-- Script -->
      <rect x="420" y="120" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="540" y="147" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Audit script</text>
      <text x="540" y="166" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">counts cost · checks the rules</text>

      <!-- Outputs -->
      <rect x="780" y="60" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="910" y="87" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Ledger row</text>
      <text x="910" y="106" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">domain/sweep/log.jsonl · one per run</text>

      <rect x="780" y="180" width="260" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="910" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Defect list</text>
      <text x="910" y="226" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">shown to you in the close table</text>
    </svg>
  </div>
</body>
</html>
