<!doctype html>
<html><head><meta charset="utf-8"><title>Pena flow</title>
<style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="diagram-pena-title diagram-pena-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="diagram-pena-title">Pena flow: how text in his name is checked and how his corrections come back</title>
  <desc id="diagram-pena-desc">Text in miya's name loads Pena, shows the profile's modules, is drafted, checked, and carries a PENA line. His correction is caught by the correction hook and stored with pena add, so the next show and check see it. Red steps 1 to 3 change on 2026-11-16: report text loads Pena, plain checks its banned phrases, the hook knows his phrasings.</desc>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1b1b1b">Pena: how text in his name is checked</text>
  <text x="24" y="56" font-size="13" fill="#555">Red = the steps that change on 2026-11-16. Grey = unchanged.</text>
  <g font-size="14" fill="#1b1b1b">
    <rect x="24" y="80" width="200" height="70" rx="6" fill="#fdecea" stroke="#d93025" stroke-width="2.5"/><text x="38" y="104" font-weight="700">1 Text in his name</text><text x="38" y="124" font-size="12">Redmine, BA, infra, WhatsApp</text><text x="38" y="140" font-size="12">+ report, sheet, adhoc text</text>
    <rect x="264" y="80" width="180" height="70" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="278" y="106">pena show</text><text x="278" y="126" font-size="12" fill="#555">profile, + new "report"</text>
    <rect x="484" y="80" width="160" height="70" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="498" y="106">Write the draft</text>
    <rect x="684" y="80" width="200" height="70" rx="6" fill="#fdecea" stroke="#d93025" stroke-width="2.5"/><text x="698" y="104" font-weight="700">2 pena check</text><text x="698" y="124" font-size="12">plain now flags its</text><text x="698" y="140" font-size="12">banned phrases</text>
    <rect x="924" y="80" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="938" y="106">PENA line</text><text x="938" y="126" font-size="12" fill="#555">under the draft</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M224 115 H260"/><path d="M444 115 H480"/><path d="M644 115 H680"/><path d="M884 115 H920"/>
  </g>
  <g font-size="14" fill="#1b1b1b">
    <rect x="24" y="220" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="38" y="246">His correction</text><text x="38" y="266" font-size="12" fill="#555">"I asked for", "another refinement"</text>
    <rect x="264" y="220" width="220" height="70" rx="6" fill="#fdecea" stroke="#d93025" stroke-width="2.5"/><text x="278" y="244" font-weight="700">3 correction hook</text><text x="278" y="264" font-size="12">knows his real phrasings</text><text x="278" y="280" font-size="12">(0 of 19 matched before)</text>
    <rect x="524" y="220" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="538" y="246">pena add / rule</text><text x="538" y="266" font-size="12" fill="#555">stored in the module</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M224 255 H260"/><path d="M484 255 H520"/><path d="M724 255 C800 255 800 160 760 154"/>
  </g>
  <text x="810" y="210" font-size="12" fill="#555">next draft is checked against it</text>
  <text x="24" y="330" font-size="13" fill="#555">Stays the same: the other profiles and modules, the show and check commands, the PENA line, the corpus file.</text>
</svg>
</body></html>
