<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Expansion closing: what must hold first</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.frame { max-width: 1000px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
.eyebrow { font-family: Consolas, monospace; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }

</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Feature · domain/de-close-gate</p>
<h1>Domain Expansion closing: what must hold first</h1>
<svg viewBox="0 0 1000 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Domain Expansion closing: what must hold first</title>
<desc id="d">Closing banner, then C1 to C8, then C9 save-quest, then Close or block.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="20" y="20" width="210" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="125" y="48" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Closing banner</text>
<text x="125" y="70" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">in the reply</text>
<line x1="230" y1="68" x2="268" y2="68" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="270" y="20" width="210" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="375" y="48" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">C1 to C8</text>
<text x="375" y="70" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">blocks · trim · audit</text>
<text x="375" y="88" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">docs · save rules</text>
<line x1="480" y1="68" x2="518" y2="68" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="520" y="20" width="210" height="96" rx="6" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.4"/>
<text x="625" y="48" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">C9 save-quest</text>
<text x="625" y="70" fill="#bf4520" font-size="12" font-family="Consolas, monospace" text-anchor="middle">every touched ticket</text>
<text x="625" y="88" fill="#bf4520" font-size="12" font-family="Consolas, monospace" text-anchor="middle">has its stage done</text>
<line x1="730" y1="68" x2="768" y2="68" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="770" y="20" width="210" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="875" y="48" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Close or block</text>
<text x="875" y="70" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">a block names</text>
<text x="875" y="88" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">the one fix</text>
