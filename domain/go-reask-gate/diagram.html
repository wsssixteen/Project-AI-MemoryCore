<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go re-ask gate · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--color-paper); color: var(--color-ink); display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/go-reask-gate</p>
    <h1>His go stands: a reply never asks for it again</h1>
    <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="g-title g-desc">
      <title id="g-title">Go re-ask gate flow</title>
      <desc id="g-desc">At Stop, the gate reads his order through the shared reader, reads my words since his last message, and blocks a reply that asks him to approve the same send; a new approval code passes.</desc>
      <defs>
        <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="180" y1="100" x2="216" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="400" y1="100" x2="436" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="620" y1="100" x2="656" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#aa)"/>
      <line x1="840" y1="100" x2="876" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="750" y1="132" x2="750" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

      <rect x="20" y="68" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="100" y="96" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">My reply ends</text>
      <text x="100" y="114" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">Stop · stop-reply-shape bundle</text>

      <rect x="220" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="310" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">His order stands?</text>
      <text x="310" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">lib/his-words decide, 8 back</text>
      <text x="310" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">a later hold or no voids it</text>

      <rect x="440" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="530" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">My words since then</text>
      <text x="530" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">reply text + wrap_up ask</text>
      <text x="530" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">"Post … now?" · "reply go"</text>

      <rect x="660" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.6"/>
      <text x="750" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Re-ask → BLOCK</text>
      <text x="750" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">quote his order, do the step now</text>
      <text x="750" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">a NEW code he never typed passes</text>

      <rect x="880" y="68" width="100" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="930" y="104" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">log.jsonl</text>

      <rect x="610" y="200" width="280" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-dasharray="5,4"/>
      <text x="750" y="224" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Bypass: [genuine-fork: reason]</text>
      <text x="750" y="242" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">a new recipient, a new decision</text>
    </svg>
  </div>
</body>
</html>
