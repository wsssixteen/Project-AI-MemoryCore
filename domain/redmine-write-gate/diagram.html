<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redmine write gate · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--color-paper); color: var(--color-ink); display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/redmine-write-gate</p>
    <h1>A Redmine write runs only on miya's own go-word</h1>
    <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="g-title g-desc">
      <title id="g-title">Redmine write gate flow</title>
      <desc id="g-desc">A shell write or a browser submit to Redmine is caught; the gate finds miya's last own message, skipping harness lines; it judges approve or deny; it allows or blocks and writes a log row. API writes stay blocked during the stage-only window.</desc>
      <defs>
        <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="180" y1="100" x2="216" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="400" y1="100" x2="436" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#aa)"/>
      <line x1="620" y1="100" x2="656" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#aa)"/>
      <line x1="840" y1="100" x2="876" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <line x1="100" y1="132" x2="100" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

      <rect x="20" y="68" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="100" y="96" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Write is about to run</text>
      <text x="100" y="114" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">shell API call · form Submit</text>

      <rect x="220" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.6"/>
      <text x="310" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Find his words</text>
      <text x="310" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">lib/his-words.js, the one reader</text>
      <text x="310" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">his order up to 8 messages back</text>

      <rect x="440" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.6"/>
      <text x="530" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Approve or deny</text>
      <text x="530" y="108" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">"no" counts only beside the verb · a later hold wins</text>
      <text x="530" y="121" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#bf4520">"why not submitting" = go · a 2nd block = a slip row</text>

      <rect x="660" y="68" width="180" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="750" y="96" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Allow or block</text>
      <text x="750" y="114" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">bypass token always wins</text>

      <rect x="880" y="68" width="100" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="930" y="104" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">log.jsonl</text>

      <rect x="20" y="220" width="400" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-dasharray="5,4"/>
      <text x="220" y="248" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3142">Shell API write in the stage-only window</text>
      <text x="220" y="266" font-size="9" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">always blocked: stage the form in the browser instead</text>

      <text x="530" y="180" font-size="10" text-anchor="middle" fill="#bf4520">orange = changed 2026-10-29 (v1.7 + v1.8, system-rules Rule 8)</text>
    </svg>
  </div>
</body>
</html>
