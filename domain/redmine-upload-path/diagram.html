<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redmine upload check</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; padding: 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 500; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/redmine-upload-path</p>
    <h1>Redmine upload check: what may be attached</h1>
    <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
      <title id="t1">Redmine upload check: what may be attached</title>
      <desc id="d1">A file upload to Redmine is checked twice: it must sit in the Task folder fix folder, and its name must not carry our internal ADHOC id. Either failure blocks the upload; both passing lets it through.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="230" y1="90" x2="270" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="490" y1="90" x2="530" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="750" y1="90" x2="790" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="125" x2="380" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="125" x2="640" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="390" y="168" fill="#4f5d75" font-size="9">no</text>
      <text x="650" y="168" fill="#4f5d75" font-size="9">yes</text>
      <text x="500" y="82" fill="#4f5d75" font-size="9">yes</text>
      <text x="760" y="82" fill="#4f5d75" font-size="9">no</text>

      <rect x="30" y="55" width="200" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="130" y="85" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">File upload to Redmine</text>
      <text x="130" y="103" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">file_upload</text>

      <rect x="270" y="55" width="220" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="380" y="85" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">In the fix folder?</text>
      <text x="380" y="103" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">2. Fix or N. Rework</text>

      <rect x="530" y="55" width="220" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="2.6"/>
      <text x="640" y="85" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Name has ADHOC-?</text>
      <text x="640" y="103" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">added 2026-11-17, 281324</text>

      <rect x="790" y="55" width="180" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="880" y="85" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Upload goes through</text>
      <text x="880" y="103" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">e.g. 281324-PROD.sql</text>

      <rect x="290" y="200" width="440" height="60" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="510" y="226" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Blocked: move it to the fix folder, or rename it</text>
      <text x="510" y="244" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">to the Redmine number · bypass [skip-upload-path: reason]</text>
    </svg>
  </div>
</body>
</html>
