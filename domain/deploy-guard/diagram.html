<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deploy-guard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Segoe UI', Arial, sans-serif; --font-mono: Consolas, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; padding: 28px 32px; box-sizing: content-box; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: 1.6rem; font-weight: 600; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · domain/deploy-guard</p>
    <h1>deploy-guard: what it refuses on a company branch</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
        <title id="t">Ticket branch to int-env</title>
        <desc id="d">Existing flow with the push check and the conflict step marked.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="230" y1="94" x2="280" y2="94" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="470" y1="94" x2="520" y2="94" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="710" y1="94" x2="760" y2="94" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="855" y1="128" x2="855" y2="250" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="760" y1="284" x2="710" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="284" x2="470" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="40" y="60" width="190" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="135" y="90" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">A git command</text>
        <text x="135" y="110" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="Consolas, monospace">etanah repo or mlk branch</text>

        <rect x="280" y="60" width="190" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="375" y="90" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">decide(): text rules</text>
        <text x="375" y="110" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="Consolas, monospace">cherry-pick, -X ours, reset</text>

        <rect x="520" y="60" width="190" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="615" y="90" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">force-push, revert</text>
        <text x="615" y="110" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="Consolas, monospace">origin-rewrite.js passes</text>

        <rect x="760" y="60" width="200" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="860" y="90" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">liveDecide(): reads git</text>
        <text x="860" y="110" fill="#bf4520" font-size="10" text-anchor="middle" font-family="Consolas, monospace">wrong-base, multi-commit</text>

        <rect x="760" y="250" width="200" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="860" y="280" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">re-merge same day</text>
        <text x="860" y="300" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="Consolas, monospace">env branch log today</text>

        <rect x="520" y="250" width="190" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="615" y="280" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Block with the rule</text>
        <text x="615" y="300" fill="#bf4520" font-size="10" text-anchor="middle" font-family="Consolas, monospace">his order token clears it</text>

        <rect x="280" y="250" width="190" height="68" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="375" y="280" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Pass</text>
        <text x="375" y="300" fill="#4f5d75" font-size="10" text-anchor="middle" font-family="Consolas, monospace">command runs</text>

        <text x="40" y="380" fill="#4f5d75" font-size="10" font-family="Consolas, monospace">v3 2026-11-25: wrong-base, git -C push</text>
      </svg>
    </div>
  </div>
</body>
</html>
