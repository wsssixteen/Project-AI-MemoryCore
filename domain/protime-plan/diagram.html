<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProTime plan runs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
    .frame { max-width: 1000px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.7rem; font-weight: 600; margin-bottom: 1.2rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">domain/protime-plan · Windows task, Mon to Fri 08:30 and 23:00</p>
    <h1>The two daily runs of the ProTime plan</h1>
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pp-title pp-desc">
      <title id="pp-title">The two daily runs of the ProTime plan</title>
      <desc id="pp-desc">Morning run settles the previous working day, plans the week three a day and places the no-number Baseline line on Monday and Wednesday. Night run settles today: adds worked items, removes unworked and finished-ahead tickets, swaps or removes the Baseline placeholder, resolves finished entries.</desc>
      <defs>
        <pattern id="pp-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="pp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#pp-dots)" opacity="0.55"/>

      <!-- arrows: morning column -->
      <line x1="250" y1="80" x2="250" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <line x1="250" y1="160" x2="250" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <line x1="250" y1="240" x2="250" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <!-- arrows: night column -->
      <line x1="750" y1="80" x2="750" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <line x1="750" y1="160" x2="750" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <line x1="750" y1="240" x2="750" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <line x1="750" y1="320" x2="750" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pp-arrow)"/>
      <!-- placeholder handoff: morning places, night swaps -->
      <polyline points="250,320 250,294" fill="none" stroke="none"/>
      <path d="M 380 294 C 520 294, 520 294, 618 294" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#pp-arrow)"/>
      <rect x="440" y="276" width="120" height="13" rx="2" fill="#f5f5f5"/>
      <text x="500" y="286" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">same day, 23:00</text>

      <!-- morning -->
      <rect x="150" y="30" width="200" height="50" rx="22" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="250" y="52" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Morning 8:30 run</text>
      <text x="250" y="68" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">also at logon</text>

      <rect x="120" y="108" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="250" y="130" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Settle the previous working day</text>
      <text x="250" y="148" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">same steps as the night run</text>

      <rect x="120" y="188" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="250" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Plan the week, 3 tickets a day</text>
      <text x="250" y="228" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">today topped up · finished skipped</text>

      <rect x="120" y="268" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="250" y="290" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Place MLK PLP Baseline</text>
      <text x="250" y="308" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">no number · Mon and Wed · not a day off</text>

      <!-- night -->
      <rect x="650" y="30" width="200" height="50" rx="22" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="750" y="52" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Night 11 PM run</text>
      <text x="750" y="68" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">settles today</text>

      <rect x="620" y="108" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="750" y="130" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Add worked tickets and adhocs</text>
      <text x="750" y="148" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">Redmine notes · 2+ turns of ours</text>

      <rect x="620" y="188" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="750" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Remove unworked and finished-ahead</text>
      <text x="750" y="228" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">only bare numbers it placed</text>

      <rect x="620" y="268" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="750" y="290" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Baseline: number or remove</text>
      <text x="750" y="308" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">release branch worked → MLK PLP Baseline 1.x</text>

      <rect x="620" y="348" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="750" y="370" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Mark finished entries Resolved</text>
      <text x="750" y="388" font-size="9.5" font-family="Consolas, monospace" text-anchor="middle" fill="#4f5d75">passed on in Redmine today</text>

      <text x="40" y="460" font-size="10" fill="#4f5d75" font-style="italic">Never touched: a line he typed or edited, a Resolved line, any adhoc except its own no-number Baseline line. A day off is left alone (its own placeholder still leaves).</text>
      <text x="40" y="480" font-size="10" fill="#4f5d75" font-style="italic">One script, domain/protime-plan/protime-plan.js; rules printed by --rules; every run logged in the main folder's log.jsonl.</text>
    </svg>
  </div>
</body>
</html>
