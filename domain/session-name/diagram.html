<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session name · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/session-name</p>
    <h1>Every session gets a dated name, whatever way it starts</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sn-title sn-desc">
      <title id="sn-title">Session name flow</title>
      <desc id="sn-desc">At his prompt the upsm-mode bundle runs session-name first under a 22 second budget, reads the title from the transcript and asks for a rename when it has no date. At the end of every turn the Stop check reads the title again: dated means goal met, undated means block once. When Ruri starts a session, a title with no date is refused.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="20" y="30" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" letter-spacing="0.14em">HIS PROMPT</text>
      <text x="20" y="180" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" letter-spacing="0.14em">END OF EVERY TURN, UNTIL DONE</text>
      <text x="20" y="310" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" letter-spacing="0.14em">RURI STARTS A SESSION</text>

      <line x1="200" y1="82" x2="236" y2="82" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="82" x2="496" y2="82" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="82" x2="736" y2="82" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="232" x2="236" y2="232" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="460" y1="232" x2="496" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="352" x2="236" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="20" y="50" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">His first prompt</text>
      <text x="110" y="96" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">new · resumed · child</text>

      <rect x="240" y="50" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Bundle runs it first</text>
      <text x="350" y="96" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">upsm-mode · budget 22 s</text>

      <rect x="500" y="50" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Read the real title</text>
      <text x="600" y="96" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">last custom-title in transcript</text>

      <rect x="740" y="50" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">No date → one rename line</text>
      <text x="860" y="96" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">dated from the first prompt</text>

      <rect x="20" y="200" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Ruri ends a turn</text>
      <text x="110" y="246" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">stop-reply-shape bundle</text>

      <rect x="240" y="200" width="220" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="350" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Is the title dated now?</text>
      <text x="350" y="246" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">the only place goal_met is written</text>

      <rect x="500" y="200" width="480" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Yes → goal met, done · No → block once with the rename line</text>
      <text x="740" y="246" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">renamed · stop-block · next Stop gave-up</text>

      <rect x="20" y="320" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Ruri starts a session</text>
      <text x="110" y="366" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">start_session · hand_off</text>

      <rect x="240" y="320" width="460" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="470" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Title with no date → refused, dated title given</text>
      <text x="470" y="366" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">PreToolUse check, settings.json</text>
    </svg>
    </div>
  </div>
</body>
</html>
