<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>template-scenario flow</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
.frame { max-width: 1000px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
.eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.4rem; }
h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
svg { width: 100%; min-width: 900px; display: block; }
</style>

<body>
<div class="frame">
<p class="eyebrow">Feature · domain/template-scenario · v1 · quest step TEMPLATE-SCENARIO</p>
<h1>A template ticket is handed back only after five checks pass</h1>
<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ts-t ts-d">
<title id="ts-t">template-scenario flow</title>
<desc id="ts-d">The fix changes a Word template. One script checks the requirement checklist, renders every config action with doc-sim, checks every changed CC tag holds a real value, word-diffs the paper against the requirement docx, and writes a green highlighted PDF. The Stop gate blocks the hand-back until the script printed PASS.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="170" y1="70" x2="198" y2="70" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="390" y1="70" x2="418" y2="70" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="610" y1="70" x2="638" y2="70" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="830" y1="104" x2="830" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="736" y1="210" x2="642" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="450" y1="210" x2="422" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="20" y="36" width="150" height="68" rx="6" fill="#ffffff" stroke="#2d3142"/>
<text x="95" y="64" font-size="13" font-weight="600" text-anchor="middle">Template fixed</text>
<text x="95" y="84" fill="#4f5d75" font-size="11" text-anchor="middle">.docx · CC tags · config</text>

<rect x="202" y="30" width="188" height="80" rx="6" fill="rgba(47,125,79,0.10)" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="296" y="56" font-size="13" font-weight="600" text-anchor="middle">1 Checklist</text>
<text x="296" y="76" fill="#2f7d4f" font-size="11" text-anchor="middle">requirement comments, Issues,</text>
<text x="296" y="92" fill="#2f7d4f" font-size="11" text-anchor="middle">BA asks, audit rows: all done</text>

<rect x="422" y="30" width="188" height="80" rx="6" fill="rgba(47,125,79,0.10)" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="516" y="56" font-size="13" font-weight="600" text-anchor="middle">2 Chain every action</text>
<text x="516" y="76" fill="#2f7d4f" font-size="11" text-anchor="middle">doc-sim CREATE → SEMAK →</text>
<text x="516" y="92" fill="#2f7d4f" font-size="11" text-anchor="middle">PERAKU, per template.config</text>

<rect x="642" y="30" width="330" height="80" rx="6" fill="rgba(47,125,79,0.10)" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="807" y="56" font-size="13" font-weight="600" text-anchor="middle">3 Real values in changed CC tags</text>
<text x="807" y="76" fill="#2f7d4f" font-size="11" text-anchor="middle">no empty, "-", &lt;placeholder&gt;, blank signature;</text>
<text x="807" y="92" fill="#2f7d4f" font-size="11" text-anchor="middle">a staging gap = FIXED-DATA row with reason</text>

<rect x="740" y="176" width="232" height="80" rx="6" fill="rgba(47,125,79,0.10)" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="856" y="202" font-size="13" font-weight="600" text-anchor="middle">4 Word diff vs requirement</text>
<text x="856" y="222" fill="#2f7d4f" font-size="11" text-anchor="middle">0 defects; CC data and accepted</text>
<text x="856" y="238" fill="#2f7d4f" font-size="11" text-anchor="middle">typos / placeholders listed</text>

<rect x="454" y="176" width="188" height="80" rx="6" fill="rgba(47,125,79,0.10)" stroke="#2f7d4f" stroke-width="1.4"/>
<text x="548" y="202" font-size="13" font-weight="600" text-anchor="middle">5 Green paper</text>
<text x="548" y="222" fill="#2f7d4f" font-size="11" text-anchor="middle">changes highlighted green,</text>
<text x="548" y="238" fill="#2f7d4f" font-size="11" text-anchor="middle">drawn in, 0 annotations</text>

<rect x="202" y="176" width="220" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
<text x="312" y="202" font-size="13" font-weight="600" text-anchor="middle">Stop gate</text>
<text x="312" y="222" fill="#bf4520" font-size="11" text-anchor="middle">hand-back blocked until</text>
<text x="312" y="238" fill="#bf4520" font-size="11" text-anchor="middle">TEMPLATE-SCENARIO: PASS</text>

<text x="500" y="300" fill="#4f5d75" font-size="11" text-anchor="middle">Screenshots: mark.py refuses nested or overlapping red boxes (--merge draws one union box)</text>
</svg>
</div>
