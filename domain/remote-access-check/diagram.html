<!doctype html>
<html><head><meta charset="utf-8"><title>Remote access check</title>
<style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="diagram-rac-title diagram-rac-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="diagram-rac-title">Remote access check at session start</title>
  <desc id="diagram-rac-desc">When a session starts on the work laptop, the check reads the RustDesk server from its config, tests the server ports, one internet control and both services, then prints either one OK line or a REMOTE ACCESS DOWN flag that goes first in the reply to miya.</desc>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1b1b1b">Remote access check: every session start on the work laptop</text>
  <text x="24" y="56" font-size="13" fill="#555">Other machines stop at the first box and connect to nothing.</text>
  <g font-size="14" fill="#1b1b1b">
    <rect x="24" y="84" width="190" height="72" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="40" y="112">Session starts</text><text x="40" y="134" font-size="12" fill="#555">PJNBRidhwan only</text>
    <rect x="254" y="84" width="190" height="72" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="270" y="112">Read RustDesk config</text><text x="270" y="134" font-size="12" fill="#555">server address only</text>
    <rect x="484" y="84" width="270" height="72" rx="6" fill="#f3f4f6" stroke="#9aa3ad"/><text x="500" y="112">Test, 2 seconds each</text><text x="500" y="134" font-size="12" fill="#555">server 21116, 21117 · 1.1.1.1:443 · both services</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none"><path d="M214 120 H250"/><path d="M444 120 H480"/><path d="M754 120 H800 V70 H830"/><path d="M800 120 V200 H830"/></g>
  <g font-size="14" fill="#1b1b1b">
    <rect x="834" y="40" width="240" height="60" rx="6" fill="#eef7ee" stroke="#3c8d40"/><text x="850" y="66" font-weight="700">All answer</text><text x="850" y="86" font-size="12">one OK line</text>
    <rect x="834" y="160" width="240" height="84" rx="6" fill="#fdecea" stroke="#d93025" stroke-width="2.5"/><text x="850" y="186" font-weight="700">Something failed</text><text x="850" y="206" font-size="12">REMOTE ACCESS DOWN, names the part</text><text x="850" y="226" font-size="12">goes first in the reply to miya</text>
  </g>
  <text x="24" y="300" font-size="13" fill="#555">It reports only. It changes no setting and restarts nothing. Every run writes one row to log.jsonl.</text>
</svg>
</body></html>
