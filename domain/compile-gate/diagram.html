<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>compile-gate</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520}
body{font-family:'Geist',system-ui,sans-serif;background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%;min-width:0}.diagram-container{width:100%;overflow-x:auto}
.eyebrow{font-family:'Geist Mono',monospace;font-size:0.66rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:0.5rem}
h1{font-family:'Instrument Serif',serif;font-size:2rem;font-weight:400;line-height:1.15;margin-bottom:1.5rem}svg{width:100%;min-width:1000px;display:block}</style></head>
<body><div class="frame"><p class="eyebrow">compile-gate · domain/compile-gate</p><h1>An etanah commit waits for a green local compile</h1>
<div class="diagram-container"><svg viewBox="0 0 1000 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">compile-gate</title><desc id="d">A commit in an etanah repo needs a green local compile first.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="320" y1="110" x2="358" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="640" y1="110" x2="678" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="320" y1="280" x2="358" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="640" y1="280" x2="678" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 820 160 L 820 195 L 180 195 L 180 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="60" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="180.0" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1. git commit in an etanah repo</text><text x="180.0" y="128" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">the hook reads the command</text><rect x="360" y="60" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="500.0" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2. Green compile on record?</text><text x="500.0" y="128" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">verify: marker newer than every .java</text><rect x="680" y="60" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="820.0" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3. No: commit refused</text><text x="820.0" y="128" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">message names the compile command</text><rect x="40" y="230" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="180.0" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4. compile-check.js run</text><text x="180.0" y="298" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">mvn -o -q, own toolchains file</text><rect x="360" y="230" width="280" height="100" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/><text x="500.0" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5. Git plugin skipped</text><text x="500.0" y="298" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">CHANGED 2026-11-23: linked folders build</text><rect x="680" y="230" width="280" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="820.0" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6. Green marker written</text><text x="820.0" y="298" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">the next commit passes</text></svg></div></div></body></html>
