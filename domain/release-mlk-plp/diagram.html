<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Release script flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; padding: 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Melaka Pelupusan release (release-prep.js): from master to staging</h1>
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Release script flow</title>
      <desc id="diagram-desc">init and branch, merge and verify, bump, push with the card, BA test, merge request to master, stag-env catch-up; one more fix after the push re-enters at add-ticket.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="200" y1="90" x2="238" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="90" x2="458" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="90" x2="678" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="830" y1="130" x2="830" y2="238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="678" y1="280" x2="642" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="458" y1="280" x2="422" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760 50 L 760 26 L 330 26 L 330 46" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <rect x="20" y="50" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="110" y="82" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">init + branch</text>
      <text x="110" y="102" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">off mlk/master</text>

      <rect x="240" y="50" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="330" y="82" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">merge + verify</text>
      <text x="330" y="102" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">stops on any conflict</text>

      <rect x="460" y="50" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="550" y="82" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">bump version</text>
      <text x="550" y="102" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">(common only if needed)</text>

      <rect x="680" y="50" width="300" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="830" y="78" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">push (his nod) + prints the card</text>
      <text x="830" y="98" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">card command re-prints it</text>
      <text x="830" y="116" fill="#4f5d75" font-size="10" font-family="'Segoe UI', Arial" text-anchor="middle">he builds and deploys from the UI</text>

      <rect x="680" y="240" width="300" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="830" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">BA tests on staging</text>
      <text x="830" y="292" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">passed = his word</text>

      <rect x="460" y="240" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="550" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">merge request</text>
      <text x="550" y="292" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">to mlk/master, reviewer merges</text>

      <rect x="240" y="240" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="330" y="272" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">stag-env catch-up</text>
      <text x="330" y="292" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">same turn as the MR</text>

      <text x="545" y="20" fill="#4f5d75" font-size="11" font-family="'Segoe UI', Arial" text-anchor="middle">one more fix after the push, before the MR: add-ticket, then merge + verify + push again</text>
      <text x="20" y="370" fill="#9a9a9a" font-size="11" font-family="'Segoe UI', Arial">Every step is a release-prep.js command; state in domain/release-mlk-plp/state/release-&lt;ver&gt;.json.</text>
    </svg>
  </div>
</body>
</html>
