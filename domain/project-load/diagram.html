<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A project's folder: who reads and writes what</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Segoe UI', Arial, sans-serif; }
  .frame { width: 1000px; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
  h1 { font-size: 22px; font-weight: 600; color: #2d3142; margin-bottom: 16px; }
  svg { width: 1000px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <h1>A project's folder: who reads and writes what</h1>
  <svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="project-load-title project-load-desc">
    <title id="project-load-title">A project's folder: who reads and writes what</title>
    <desc id="project-load-desc">A mention of the project loads its card from START.md. Decisions go to the ledger, his words to history, delegated reports to reports, and work in progress from any agent to drafts.</desc>
    <defs><marker id="pl-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
    <line x1="230" y1="130" x2="298" y2="130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pl-a)"/>
    <line x1="530" y1="130" x2="598" y2="50" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pl-a)"/>
    <line x1="530" y1="130" x2="598" y2="130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pl-a)"/>
    <line x1="530" y1="130" x2="598" y2="210" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pl-a)"/>
    <rect x="1" y="85" width="228" height="90" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="115" y="122" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">He names the project</text>
    <text x="115" y="146" fill="#4f5d75" font-size="13" text-anchor="middle">in any session</text>
    <rect x="300" y="85" width="228" height="90" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="414" y="122" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">Card from START.md</text>
    <text x="414" y="146" fill="#4f5d75" font-size="13" text-anchor="middle">goal, spec, rules, state, next</text>
    <rect x="600" y="15" width="398" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="799" y="45" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">DECISIONS.md and history</text>
    <text x="799" y="67" fill="#4f5d75" font-size="13" text-anchor="middle">what was ruled, and his words</text>
    <rect x="600" y="95" width="398" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="799" y="125" fill="#2d3142" font-size="15" font-weight="600" text-anchor="middle">reports</text>
    <text x="799" y="147" fill="#4f5d75" font-size="13" text-anchor="middle">what a delegated session did</text>
    <rect x="600" y="175" width="398" height="70" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1.6"/>
    <text x="799" y="205" fill="#bf4520" font-size="15" font-weight="600" text-anchor="middle">drafts (new 2026-11-01)</text>
    <text x="799" y="227" fill="#4f5d75" font-size="13" text-anchor="middle">work in progress, one version per agent, shared</text>
  </svg>
</div>
</body>
</html>
