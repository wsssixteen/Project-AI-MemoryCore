<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alter-sim · Flowchart</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · domain/alter-sim</p>
    <h1>See an alter's result on staging before it happens</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="as-title as-desc">
      <title id="as-title">alter-sim flow</title>
      <desc id="as-desc">The page's dry-run log feeds alter-sim, which refuses PROD, boots the real app on connections that never commit, runs the page's own alter calls, reads every changed row, always rolls back, proves the rollback with a fresh read, and after the real alter compares the preview with the real rows.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <line x1="180" y1="80" x2="216" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="80" x2="416" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="80" x2="616" y2="80" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="780" y1="80" x2="816" y2="80" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 900,112 V 160 H 108 Q 100,160 100,168 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="180" y1="248" x2="216" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="248" x2="416" y2="248" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="580" y1="248" x2="616" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="384" y="222" width="28" height="14" rx="2" fill="#f5f5f5"/>
      <text x="398" y="232" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">NOD</text>

      <rect x="20" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Page's dry-run log</text>
      <text x="100" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">alter.js --dry-run</text>

      <rect x="220" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Refuse PROD</text>
      <text x="300" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">stg1 · stg2 · mlit only</text>

      <rect x="420" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Boot the real app</text>
      <text x="500" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">connections never commit</text>

      <rect x="620" y="48" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="700" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Run the page's alter</text>
      <text x="700" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">alterFlow + listener inline</text>

      <rect x="820" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Read changed rows</text>
      <text x="900" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">before → after table</text>

      <rect x="20" y="216" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Always roll back</text>
      <text x="100" y="262" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">then a fresh read = before</text>

      <rect x="220" y="216" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">ALTER-SIM line</text>
      <text x="300" y="262" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">new tugasan · holder · task</text>

      <rect x="420" y="216" width="160" height="64" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Real alter</text>
      <text x="500" y="262" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">alter.js, AFTER check</text>

      <rect x="620" y="216" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Compare</text>
      <text x="700" y="262" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">MATCH or MISMATCH per field</text>

      <text x="20" y="320" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">Calls that would leave the app (other modules, report server, mail) are blocked and listed; the preview then says BLOCKED.</text>
    </svg>
    </div>
  </div>
</body>
</html>
