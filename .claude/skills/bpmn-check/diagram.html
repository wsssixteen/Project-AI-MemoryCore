<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bpmn-check flow</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; }
.frame { width: 1000px; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
<h1>bpmn-check: from a flow change to the applied model</h1>
<svg viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc-title bc-desc">
<title id="bc-title">bpmn-check flow</title>
<desc id="bc-desc">Run the validator, answer the judgment checks, give the modeler steps with the Description text, then re-run the validator on the applied model.</desc>
<defs><marker id="bc-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
<rect x="10" y="30" width="210" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="115" y="68" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Step 0: validator</text>
<text x="115" y="92" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">Structure findings answered</text>
<rect x="263" y="30" width="210" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="368" y="68" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Step 1: judgment checks</text>
<text x="368" y="92" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">One verdict per row</text>
<rect x="516" y="30" width="210" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="621" y="68" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Step 2: modeler steps</text>
<text x="621" y="92" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">Each arrow + Description text</text>
<rect x="769" y="30" width="221" height="90" rx="6" fill="#fff" stroke="#2d3142"/>
<text x="880" y="68" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle" font-family="'Segoe UI', Arial">Re-run on applied model</text>
<text x="880" y="92" fill="#4f5d75" font-size="12" text-anchor="middle" font-family="'Segoe UI', Arial">The saved model is the truth</text>
<line x1="220" y1="75" x2="261" y2="75" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#bc-a)"/>
<line x1="473" y1="75" x2="514" y2="75" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#bc-a)"/>
<line x1="726" y1="75" x2="767" y2="75" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#bc-a)"/>
</svg>
</div>
</body>
</html>
