<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pena · Swimlane</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Segoe UI', Arial, sans-serif;
      --font-mono:     Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Skill · pena</p>
    <h1>Pena: a draft in his name</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Pena steps</title>
      <desc id="d">Pena draft steps, then step 6 stages the Redmine form, miya submits.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <line x1="40" y1="60" x2="960" y2="60" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="150" x2="960" y2="150" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="330" x2="960" y2="330" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="170" y1="60" x2="170" y2="330" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="56" y="110" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" letter-spacing="0.18em">RURI</text>
        <text x="56" y="200" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" letter-spacing="0.18em">EDGE FORM</text>
        <text x="56" y="290" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" letter-spacing="0.18em">MIYA</text>
        <line x1="330" y1="105" x2="370" y2="105" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="530" y1="105" x2="570" y2="105" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 730,105 H 772 Q 780,105 780,113 V 172" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="780" y1="219" x2="780" y2="262" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="190" y="81" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="260" y="102" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">1-2 Profile + show</text>
        <text x="260" y="117" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle">lib/pena.js show</text>
        <rect x="370" y="81" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="102" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">3-4b Draft + check</text>
        <text x="450" y="117" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle">lib/pena.js check</text>
        <rect x="570" y="81" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="650" y="102" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">5 Draft in chat</text>
        <text x="650" y="117" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle">PENA: line under it</text>
        <rect x="690" y="171" width="180" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="780" y="192" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">6 Stage form, same turn</text>
        <text x="780" y="207" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle">notes · assignee · files · read back</text>
        <rect x="700" y="262" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="283" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">He clicks Submit</text>
        <text x="780" y="298" fill="#4f5d75" font-size="8" font-family="Consolas, monospace" text-anchor="middle">never submitted by Ruri</text>
        <line x1="40" y1="350" x2="960" y2="350" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="366" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="374" fill="#4f5d75" font-size="8.5">Step 6, added 2026-11-17</text>
      </svg>
  </div>
</body>
</html>
