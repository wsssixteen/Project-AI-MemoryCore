<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change card · before and after</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Segoe UI', Arial, sans-serif; --font-mono: Consolas, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Feature · change-card · runs inside the change route (system/INDEX.md)</p>
    <h1>Every system change shows the same five lines before your nod and after it lands</h1>
    <svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Change card in the change route</title>
      <desc id="d">The eight change route steps; step 3 shows the BEFORE card, step 8 shows the AFTER card; the card has five lines.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3142">
        <rect x="20" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="70" y="54" text-anchor="middle" font-weight="600">1 Enter</text>
        <rect x="140" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="190" y="54" text-anchor="middle" font-weight="600">2 Flow</text>
        <text x="190" y="72" text-anchor="middle" font-size="11" fill="#4f5d75">How picture</text>
        <rect x="260" y="30" width="110" height="56" rx="6" fill="#fbeee8" stroke="#bf4520" stroke-width="2"/>
        <text x="315" y="54" text-anchor="middle" font-weight="600">3 Check + nod</text>
        <text x="315" y="72" text-anchor="middle" font-size="11" fill="#bf4520">BEFORE card</text>
        <rect x="390" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="440" y="62" text-anchor="middle" font-weight="600">4 Build</text>
        <rect x="510" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="560" y="62" text-anchor="middle" font-weight="600">5 Verify</text>
        <rect x="630" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="680" y="62" text-anchor="middle" font-weight="600">6 Record</text>
        <rect x="750" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#4f5d75"/>
        <text x="800" y="62" text-anchor="middle" font-weight="600">7 Land</text>
        <rect x="870" y="30" width="110" height="56" rx="6" fill="#fbeee8" stroke="#bf4520" stroke-width="2"/>
        <text x="925" y="54" text-anchor="middle" font-weight="600">8 Report</text>
        <text x="925" y="72" text-anchor="middle" font-size="11" fill="#bf4520">AFTER card</text>
        <g stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="120" y1="58" x2="138" y2="58"/><line x1="240" y1="58" x2="258" y2="58"/><line x1="370" y1="58" x2="388" y2="58"/>
          <line x1="490" y1="58" x2="508" y2="58"/><line x1="610" y1="58" x2="628" y2="58"/><line x1="730" y1="58" x2="748" y2="58"/><line x1="850" y1="58" x2="868" y2="58"/>
        </g>

        <rect x="200" y="130" width="600" height="300" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="500" y="160" text-anchor="middle" font-weight="600" font-size="15">The card: one sentence each</text>
        <text x="230" y="200" font-weight="600">What</text><text x="320" y="200">the part and what it does</text>
        <text x="230" y="240" font-weight="600">Why</text><text x="320" y="240">the failure or ask it answers, with the date</text>
        <text x="230" y="280" font-weight="600">How</text><text x="320" y="280">+ the step 2 flow picture, reused</text>
        <text x="230" y="320" font-weight="600">When</text><text x="320" y="320">the moment the part runs (its trigger)</text>
        <text x="230" y="360" font-weight="600">Where</text><text x="320" y="360">+ the change map (system map boxes)</text>
        <text x="500" y="405" text-anchor="middle" font-size="12" fill="#bf4520">Where picture = the change map (lib/change-map.js)</text>
        <g stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
          <path d="M315 86 L315 110 L260 110 L260 130"/><path d="M925 86 L925 110 L740 110 L740 130"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
