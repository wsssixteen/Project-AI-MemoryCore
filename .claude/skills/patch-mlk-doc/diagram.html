<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>patch-mlk-doc: replace a PROD document, then reset its PDF</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#bf4520}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}

<body><div class="frame"><p class="eyebrow">Skill · patch-mlk-doc</p><h1>patch-mlk-doc: replace a PROD document, then reset its PDF</h1>
<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">patch-mlk-doc: replace a PROD document, then reset its PDF</title><desc id="d">locate the latest active revision, prepare the corrected file keeping the generation date, upload it through infra, then null the PDF so it regenerates.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/><rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<rect x="20" y="110" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="105" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">locator query</text><text x="105" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">umm_a_dok_keluaran</text><text x="105" y="173" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">latest active revision</text><line x1="192" y1="150" x2="213.5" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="217.5" y="110" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="302.5" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">download original</text><text x="302.5" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">infra, one box</text><text x="302.5" y="173" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">rollback copy</text><line x1="389.5" y1="150" x2="411" y2="150" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="415" y="110" width="170" height="80" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="2"/><text x="500" y="140" fill="#bf4520" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">correct the file</text><text x="500" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">keep generation date</text><text x="500" y="173" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">BA date differs: ask</text><line x1="587" y1="150" x2="608.5" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="612.5" y="110" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="697.5" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">infra upload</text><text x="697.5" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">lokasi_fail list</text><text x="697.5" y="173" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">zip attached</text><line x1="784.5" y1="150" x2="806" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="810" y="110" width="170" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="895" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">reset PDF</text><text x="895" y="160" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">LOKASI_FAIL_PDF=NULL</text><text x="895" y="173" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">after upload only</text>
<text x="20" y="235" fill="#bf4520" font-size="10" font-family="Consolas, monospace">orange = the step changed 2026-10-29 (patch ticket, per miya)</text>
</svg></div></body></html>
