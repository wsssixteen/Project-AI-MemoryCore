<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domain Expansion: today and after the upgrade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
    .frame { box-sizing: content-box; width: 1000px; padding: 28px 32px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 18px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Domain Expansion: today, and after the upgrade</h1>
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Domain Expansion today and after the upgrade</title>
      <desc id="d">Today it checks saved files and proposals pile up. After the upgrade it reads the session transcript, routes each failure to a home, fixes it and watches that it held.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="20" y="30" fill="#4f5d75" font-size="13" font-weight="600" font-family="'Segoe UI', Arial">TODAY</text>
      <line x1="210" y1="85" x2="268" y2="85" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="470" y1="85" x2="528" y2="85" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="20" y="50" width="190" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="115" y="80" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Session ends</text>
      <text x="115" y="101" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">transcript not read</text>

      <rect x="270" y="50" width="200" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="370" y="80" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Checks files are saved</text>
      <text x="370" y="101" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">0 of 13 failures caught</text>

      <rect x="530" y="50" width="200" height="70" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="630" y="80" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Proposals pile up</text>
      <text x="630" y="101" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">888 logged, 0 ruled</text>

      <line x1="20" y1="165" x2="980" y2="165" stroke="rgba(45,49,66,0.15)"/>
      <text x="20" y="200" fill="#4f5d75" font-size="13" font-weight="600" font-family="'Segoe UI', Arial">AFTER THE UPGRADE</text>

      <line x1="170" y1="265" x2="208" y2="265" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="400" y1="265" x2="438" y2="265" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="630" y1="265" x2="668" y2="265" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="830" y1="265" x2="868" y2="265" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="20" y="225" width="150" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="95" y="260" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">This session's</text>
      <text x="95" y="280" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">transcript</text>

      <rect x="210" y="225" width="190" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
      <text x="305" y="255" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Finds the failures</text>
      <text x="305" y="276" fill="#4f5d75" font-size="12" font-family="Consolas, monospace" text-anchor="middle">lib/session-audit.js</text>
      <text x="305" y="293" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">must catch 9 of 13</text>

      <rect x="440" y="225" width="190" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="535" y="255" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Routes each one</text>
      <text x="535" y="276" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">knowledge, tool, gate,</text>
      <text x="535" y="293" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">workflow or memory</text>

      <rect x="670" y="225" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="750" y="255" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Close is blocked</text>
      <text x="750" y="276" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">until every finding</text>
      <text x="750" y="293" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">has a home</text>

      <rect x="870" y="225" width="110" height="80" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <text x="925" y="255" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">Checks it</text>
      <text x="925" y="275" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', Arial" text-anchor="middle">held</text>
      <text x="925" y="293" fill="#4f5d75" font-size="12" font-family="'Segoe UI', Arial" text-anchor="middle">repeat = forced</text>

      <text x="20" y="355" fill="#4f5d75" font-size="14" font-family="'Segoe UI', Arial">Ruri builds Phase 1 and proves it on this session's transcript. Your step: say go. No data changes.</text>
    </svg>
  </div>
</body>
</html>
