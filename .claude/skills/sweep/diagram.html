<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweep run flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Segoe UI', Arial, sans-serif;
      --font-mono:     Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · /sweep</p>
    <h1>One sweep run, start to close: every run ends with audit and refine</h1>

    <svg viewBox="0 0 1080 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Sweep run flow</title>
      <desc id="d">Top row: flag on, W1+W2 and W3 launched together, the controller banks and checks, W4 per ticket. Bottom row: flag off and board update, the audit Tool writes the ledger row, audit and refine, the close table then stop.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Row 1 arrows -->
      <line x1="250" y1="80" x2="288" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="510" y1="80" x2="548" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="770" y1="80" x2="808" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Wrap from row 1 end to row 2 start -->
      <path d="M 920 112 L 920 165 L 140 165 L 140 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Row 2 arrows -->
      <line x1="250" y1="240" x2="288" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="510" y1="240" x2="548" y2="240" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="770" y1="240" x2="808" y2="240" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Row 1 boxes -->
      <rect x="30" y="48" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="75" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Flag on</text>
      <text x="140" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">main folder · run start time</text>

      <rect x="290" y="48" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="75" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">W1+W2 and W3 together</text>
      <text x="400" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">origin/mlk/master · write to scratch</text>

      <rect x="550" y="48" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="75" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Bank and check</text>
      <text x="660" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">copy to quest folder · 1 check each</text>

      <rect x="810" y="48" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="920" y="75" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">W4 audit per ticket</text>
      <text x="920" y="94" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">starts when its 2 passes are banked</text>

      <!-- Row 2 boxes -->
      <rect x="30" y="208" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Flag off, board updated</text>
      <text x="140" y="254" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">phase= per quest in active.txt</text>

      <rect x="290" y="208" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Audit Tool</text>
      <text x="400" y="254" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">ledger row · defects · read back</text>

      <rect x="550" y="208" width="220" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="660" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Audit and refine</text>
      <text x="660" y="254" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">fix now · refine · accuracy first</text>

      <rect x="810" y="208" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="920" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Close table, then stop</text>
      <text x="920" y="254" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">fixes run in their own sessions</text>
    </svg>
  </div>
</body>
</html>
