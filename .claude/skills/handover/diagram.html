<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>/handover: the check before a note leaves</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.6rem; font-weight: 600; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Skill · /handover</p>
    <h1>/handover: the check before a note leaves</h1>
    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="handover-title handover-desc">
      <title id="handover-title">/handover: the check before a note leaves</title>
      <desc id="handover-desc">Flow from a diagnosed ticket through a new hand-over check, staging, miya's review, to the other team fixing; two options for where the check lives.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="190" y1="88" x2="223" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="385" y1="88" x2="418" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="88" x2="613" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="775" y1="88" x2="808" y2="88" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="305" y1="150" x2="200" y2="238" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="305" y1="150" x2="560" y2="238" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <text x="110" y="44" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">BEFORE</text>
      <text x="305" y="44" fill="#bf4520" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">/HANDOVER</text>
      <text x="500" y="44" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">ME</text>
      <text x="695" y="44" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">YOU</text>
      <text x="890" y="44" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">END</text>

      <rect x="30" y="56" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="84" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Ticket diagnosed</text>
      <text x="110" y="102" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">sweep + Opus audit</text>

      <rect x="225" y="56" width="160" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
      <text x="305" y="80" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Hand-over check</text>
      <text x="305" y="97" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">proven / not run</text>
      <text x="305" y="111" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">fix file · top-model audit</text>
      <text x="305" y="140" fill="#9aa1b0" font-size="10" text-anchor="middle">proof · fix · audit · focused note</text>

      <rect x="420" y="56" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="84" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Stage Redmine</text>
      <text x="500" y="102" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">note + fix file</text>

      <rect x="615" y="56" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="695" y="84" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">You review</text>
      <text x="695" y="102" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">then Submit</text>

      <rect x="810" y="56" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="890" y="84" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Other team fixes</text>
      <text x="890" y="102" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">proof + fix in hand</text>

      <text x="745" y="290" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" letter-spacing="0.12em">WHO CHECKS IT</text>

      <rect x="60" y="240" width="300" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="210" y="268" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">A · Stop check</text>
      <text x="210" y="290" fill="#4f5d75" font-size="11" text-anchor="middle">ownership-input-check needs</text>
      <text x="210" y="306" fill="#4f5d75" font-size="11" text-anchor="middle">a Handover: line</text>
      <text x="210" y="324" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">when a note or file is staged</text>

      <rect x="420" y="240" width="300" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="570" y="268" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">B · loaders</text>
      <text x="570" y="290" fill="#4f5d75" font-size="11" text-anchor="middle">cross-module-check verdict +</text>
      <text x="570" y="306" fill="#4f5d75" font-size="11" text-anchor="middle">handoff-load on his words</text>
      <text x="570" y="324" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">both point to /handover</text>
    </svg>
  </div>
</body>
</html>
