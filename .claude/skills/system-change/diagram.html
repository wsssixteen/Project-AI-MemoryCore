<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System change · Route</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Segoe UI', Arial, sans-serif;
      --font-mono:    Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Workflow · /system-change · steps owned by Rules in system/INDEX.md §The change route</p>
    <h1>Every system change takes one route and ends on main</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-title sc-desc">
      <title id="sc-title">System change workflow</title>
      <desc id="sc-desc">Six triggers enter one route: inventory, design picture, his nod, build in the lane, verify, record, land on main, report.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- entry -->
      <rect x="20" y="16" width="960" height="70" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="44" fill="#2d3142" font-size="13" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">Seven lanes in, one route</text>
      <text x="500" y="66" fill="#4f5d75" font-size="10" font-family="Consolas, monospace" text-anchor="middle">CLAUDE.md · a workflow step · memory · new function · audit go · slip logs · a correction</text>
      <line x1="117" y1="86" x2="117" y2="134" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- row 1, left to right -->
      <line x1="215" y1="172" x2="271" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="470" y1="172" x2="526" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="725" y1="172" x2="781" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="882" y1="204" x2="882" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="20" y="140" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="117" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">1. Enter</text>
      <text x="117" y="186" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">model · kind on the map</text>

      <rect x="275" y="140" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">2. Inventory + flow</text>
      <text x="372" y="186" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">system-rules · flow first</text>

      <rect x="530" y="140" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="627" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">3. Your nod</text>
      <text x="627" y="186" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">standing for corrections</text>

      <rect x="785" y="140" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="882" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">4. Build in the lane</text>
      <text x="882" y="186" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">lane's own doc = the detail</text>

      <!-- row 2, right to left -->
      <line x1="785" y1="314" x2="729" y2="314" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="530" y1="314" x2="474" y2="314" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="275" y1="314" x2="219" y2="314" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="785" y="282" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="882" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">5. Verify</text>
      <text x="882" y="328" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">eval · self-audit · diagram</text>

      <rect x="530" y="282" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="627" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">6. Record</text>
      <text x="627" y="328" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">change record · watch · map</text>

      <rect x="275" y="282" width="195" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
      <text x="372" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">7. Land on main, this turn</text>
      <text x="372" y="328" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">commit · push · land-on-main · SHA</text>

      <rect x="20" y="282" width="195" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="117" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">8. Report</text>
      <text x="117" y="328" fill="#4f5d75" font-size="9" font-family="Consolas, monospace" text-anchor="middle">System › Kind tables</text>

      <text x="20" y="392" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">Every step runs every time. Each lane keeps its own detail for step 4 and points here for the order.</text>
      <text x="20" y="412" fill="#4f5d75" font-size="11" font-style="italic" font-family="'Segoe UI', Arial, sans-serif">Step 7 is a step, not a gate: commit, push, land-on-main, GitHub SHA = main-folder SHA, same turn.</text>
    </svg>
    </div>
  </div>
</body>
</html>
