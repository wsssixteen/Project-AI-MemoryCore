<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>explain-diagram: how a picture is made</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; min-width: 0; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Skill · .claude/skills/explain-diagram</p>
    <h1>explain-diagram: how a picture is made</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
        <title id="t">explain-diagram: how a picture is made</title>
        <desc id="d">Pick the size, apply content rules, etanah issues use the urusan flow and mark the value, render and look, send.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="20" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">1. Pick the size</text>
        <text x="120" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">table · picture · 2-box line</text>

        <line x1="220" y1="80" x2="258" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="260" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">2. Content rules</text>
        <text x="360" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">≤9 boxes · mark one thing</text>

        <line x1="460" y1="80" x2="498" y2="80" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="500" y="40" width="220" height="80" rx="6" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="610" y="66" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">2b. Etanah issue</text>
        <text x="610" y="88" fill="#bf4520" font-size="11" font-family="Consolas" text-anchor="middle">urusan lanes per module</text>
        <text x="610" y="106" fill="#bf4520" font-size="11" font-family="Consolas" text-anchor="middle">value of concern highlighted</text>

        <line x1="720" y1="80" x2="758" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="760" y="40" width="220" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="870" y="72" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">3. Render + look</text>
        <text x="870" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">lib/diagram-render.js</text>

        <line x1="870" y1="120" x2="870" y2="198" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="760" y="200" width="220" height="80" rx="22" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
        <text x="870" y="232" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">4. Reply</text>
        <text x="870" y="254" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">one sentence + PNG sent</text>
      </svg>
    </div>
  </div>
</body>
</html>
