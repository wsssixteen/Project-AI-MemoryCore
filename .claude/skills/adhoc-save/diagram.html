<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket check: Semakan white page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; min-width: 0; padding: 28px 32px; box-sizing: content-box; background: #f5f5f5; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Adhoc route · ADHOC-DMPRU-2026-1</p>
    <h1>When to tell the BA to open a ticket: six checks, all passed here</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
        <title id="t">Ticket check: Semakan white page</title>
        <desc id="d">Six checks in order, each with what this case showed, ending in a ticket ask.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="20" y="20" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="170" y="50" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">1. Failure is on record</text>
        <text x="170" y="74" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">3 error rows, same message</text>
        <text x="170" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">17:19 to 17:20</text>

        <line x1="320" y1="72" x2="348" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="350" y="20" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="500" y="50" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">2. Code line read on the live branch</text>
        <text x="500" y="74" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">page reads the field, form lacks it</text>
        <text x="500" y="94" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">int-env, stag-env, master, 1.9.0</text>

        <line x1="650" y1="72" x2="678" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="680" y="20" width="300" height="104" rx="6" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="830" y="50" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">3. No data or user step can stop it</text>
        <text x="830" y="74" fill="#bf4520" font-size="11" font-family="Consolas" text-anchor="middle">every DMPRU reads the same line</text>
        <text x="830" y="94" fill="#bf4520" font-size="11" font-family="Consolas" text-anchor="middle">the deciding check</text>

        <line x1="830" y1="124" x2="830" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="680" y="166" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="830" y="196" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">4. It is our module</text>
        <text x="830" y="220" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">etanah-pelupusan page and form</text>
        <text x="830" y="240" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">no other team's code in the path</text>

        <line x1="680" y1="218" x2="652" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="350" y="166" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="500" y="196" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">5. Requirement says it should work</text>
        <text x="500" y="220" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">219144 DMPRU migrasi, so a bug</text>
        <text x="500" y="240" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">not a change request</text>

        <line x1="350" y1="218" x2="322" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="20" y="166" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="170" y="196" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">6. Nobody has fixed it already</text>
        <text x="170" y="220" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">the form never had this field</text>
        <text x="170" y="240" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">on any remote branch</text>

        <line x1="170" y1="270" x2="170" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="20" y="310" width="960" height="70" rx="22" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)"/>
        <text x="500" y="340" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">All six pass: ask for the ticket</text>
        <text x="500" y="362" fill="#4f5d75" font-size="11" font-family="Consolas" text-anchor="middle">still open: the fix itself is not tested on screen</text>
      </svg>
    </div>
  </div>
</body>
</html>
