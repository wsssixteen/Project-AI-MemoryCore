<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release to master: the merge request steps</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--node:#fff;--node-stroke:rgba(45,49,66,.3);--lane:rgba(45,49,66,.04);--sans:'Segoe UI',Arial,sans-serif;--mono:Consolas,monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);width:max-content}
.frame{box-sizing:content-box;padding:28px 32px;width:888px}
h1{font:600 20px var(--sans);margin-bottom:12px}
svg{width:888px;display:block}
.lane{fill:var(--lane);stroke:none}.lane-t{fill:var(--muted);font:600 14px var(--sans)}
.node{fill:var(--node);stroke:var(--node-stroke)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.4}
.node-title{fill:var(--ink);font:600 13px var(--sans)}.node-sub{fill:var(--muted);font:11px var(--mono)}.focal-t{fill:var(--accent)}
.num{fill:var(--muted);font:600 11px var(--mono)}
.connector{fill:none;stroke:var(--muted);stroke-width:1.2}
</style></head><body><div class="frame">
<h1>Release to master: the merge request steps</h1>
<svg viewBox="0 0 888 786" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phasef-title phasef-desc">
<title id="phasef-title">Release to master: the merge request steps</title>
<desc id="phasef-desc">Nine steps across three lanes. Step 4, Ruri filling the merge request, replaces the old direct push to master. Step 5 is the confirmation to be removed later.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
<rect class="lane" x="28" y="8" width="272" height="774" rx="8"/><text class="lane-t" x="164" y="34" text-anchor="middle">You</text><rect class="lane" x="308" y="8" width="272" height="774" rx="8"/><text class="lane-t" x="444" y="34" text-anchor="middle">Ruri</text><rect class="lane" x="588" y="8" width="272" height="774" rx="8"/><text class="lane-t" x="724" y="34" text-anchor="middle">Aaron or Alex</text><rect class="node" x="40" y="56" width="248" height="56" rx="6"/><text class="num" x="49" y="72">1</text><text class="node-title" x="164" y="81" text-anchor="middle">Say &quot;BA passed&quot;</text><text class="node-sub" x="164" y="99" text-anchor="middle">BAQA baseline result</text><path class="connector" d="M164 112 L164 123 L444 123 L444 134" marker-end="url(#arrow)"/><rect class="node" x="320" y="136" width="248" height="56" rx="6"/><text class="num" x="329" y="152">2</text><text class="node-title" x="444" y="161" text-anchor="middle">Script checks the release</text><text class="node-sub" x="444" y="179" text-anchor="middle">merge-to-master --ba-approved</text><path class="connector" d="M444 192 L444 203 L164 203 L164 214" marker-end="url(#arrow)"/><rect class="node" x="40" y="216" width="248" height="56" rx="6"/><text class="num" x="49" y="232">3</text><text class="node-title" x="164" y="241" text-anchor="middle">Pick the reviewer</text><text class="node-sub" x="164" y="259" text-anchor="middle">Aaron or Alex · stays for good</text><path class="connector" d="M164 272 L164 283 L444 283 L444 294" marker-end="url(#arrow)"/><rect class="node focal" x="320" y="296" width="248" height="56" rx="6"/><text class="num" x="329" y="312">4</text><text class="node-title focal-t" x="444" y="321" text-anchor="middle">Fill the merge request in Edge</text><text class="node-sub focal-t" x="444" y="339" text-anchor="middle">commit count · no squash · keep branch</text><path class="connector" d="M444 352 L444 363 L164 363 L164 374" marker-end="url(#arrow)"/><rect class="node" x="40" y="376" width="248" height="56" rx="6" stroke-dasharray="5 4"/><text class="num" x="49" y="392">5</text><text class="node-title" x="164" y="401" text-anchor="middle">Confirm the filled form</text><text class="node-sub" x="164" y="419" text-anchor="middle">removed later, once reliable</text><path class="connector" d="M164 432 L164 443 L444 443 L444 454" marker-end="url(#arrow)"/><rect class="node" x="320" y="456" width="248" height="56" rx="6"/><text class="num" x="329" y="472">6</text><text class="node-title" x="444" y="481" text-anchor="middle">Click Create, record the link</text><text class="node-sub" x="444" y="499" text-anchor="middle">read back from GitLab</text><path class="connector" d="M444 512 L444 523 L724 523 L724 534" marker-end="url(#arrow)"/><rect class="node" x="600" y="536" width="248" height="56" rx="6"/><text class="num" x="609" y="552">7</text><text class="node-title" x="724" y="561" text-anchor="middle">Approve and merge</text><text class="node-sub" x="724" y="579" text-anchor="middle">in GitLab</text><path class="connector" d="M724 592 L724 603 L164 603 L164 614" marker-end="url(#arrow)"/><rect class="node" x="40" y="616" width="248" height="56" rx="6"/><text class="num" x="49" y="632">8</text><text class="node-title" x="164" y="649" text-anchor="middle">Say &quot;merged&quot;</text><path class="connector" d="M164 672 L164 683 L444 683 L444 694" marker-end="url(#arrow)"/><rect class="node" x="320" y="696" width="248" height="56" rx="6"/><text class="num" x="329" y="712">9</text><text class="node-title" x="444" y="721" text-anchor="middle">Check master, then staging</text><text class="node-sub" x="444" y="739" text-anchor="middle">merge-to-master --check · stag-catchup</text>
</svg></div></body></html>
