<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wrong row in a patch: what to do with it</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #2d3142; display: flex; justify-content: center; padding: 2rem; }
    .frame { max-width: 1100px; width: 100%; padding: 28px 32px; box-sizing: content-box; }
    .eyebrow { font-family: Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.4rem; }
    h1 { font-size: 1.7rem; font-weight: 600; margin-bottom: 1.2rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">script-check rule 4 · first YES wins · a flag counts only when proven</p>
    <h1>Wrong row in a patch: what to do with it</h1>
    <svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crit-title crit-desc">
      <title id="crit-title">Wrong row in a patch: what to do with it</title>
      <desc id="crit-desc">Four questions in order: record or proof, app cancel screen, a status or flag the app really honours (four proofs), pointer or draft. Each YES leads to an action; the last NO leads to unlink and ask. The 288625 case sits at the side.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="270" y1="126" x2="270" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="270" y1="276" x2="270" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="270" y1="426" x2="270" y2="522" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="270" y1="636" x2="270" y2="690" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="390" y1="69" x2="560" y2="69" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="390" y1="219" x2="560" y2="219" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="390" y1="369" x2="560" y2="369" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="390" y1="579" x2="560" y2="579" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <g font-family="Consolas, monospace" font-size="10" fill="#4f5d75" text-anchor="middle">
        <rect x="456" y="53" width="34" height="14" rx="2" fill="#f5f5f5"/><text x="473" y="64">YES</text>
        <rect x="456" y="203" width="34" height="14" rx="2" fill="#f5f5f5"/><text x="473" y="214">YES</text>
        <rect x="430" y="353" width="86" height="14" rx="2" fill="#f5f5f5"/><text x="473" y="364">YES, PROVEN</text>
        <rect x="456" y="563" width="34" height="14" rx="2" fill="#f5f5f5"/><text x="473" y="574">YES</text>
        <rect x="278" y="136" width="28" height="14" rx="2" fill="#f5f5f5"/><text x="292" y="147">NO</text>
        <rect x="278" y="286" width="28" height="14" rx="2" fill="#f5f5f5"/><text x="292" y="297">NO</text>
        <rect x="278" y="466" width="180" height="14" rx="2" fill="#f5f5f5"/><text x="368" y="477">NO, OR ANY PROOF FAILS</text>
        <rect x="278" y="656" width="28" height="14" rx="2" fill="#f5f5f5"/><text x="292" y="667">NO</text>
      </g>

      <g fill="#ffffff" stroke="#2d3142" stroke-width="1">
        <polygon points="270,12 390,69 270,126 150,69"/>
        <polygon points="270,162 390,219 270,276 150,219"/>
        <polygon points="270,312 390,369 270,426 150,369"/>
        <polygon points="270,522 390,579 270,636 150,579"/>
      </g>
      <g font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">
        <text x="270" y="66">A record or</text><text x="270" y="83">proof?</text>
        <text x="270" y="216">App has a cancel</text><text x="270" y="233">screen for it?</text>
        <text x="270" y="358">A status or flag</text><text x="270" y="375">the app really</text><text x="270" y="392">honours?</text>
        <text x="270" y="570">Pointer, draft or</text><text x="270" y="587">duplicate, nothing</text><text x="270" y="604">points to it?</text>
      </g>

      <g fill="#ffffff" stroke="#2d3142" stroke-width="1">
        <rect x="560" y="39" width="400" height="60" rx="6"/>
        <rect x="560" y="189" width="400" height="60" rx="6"/>
        <rect x="560" y="320" width="400" height="168" rx="6"/>
        <rect x="560" y="549" width="400" height="60" rx="6"/>
        <rect x="140" y="690" width="260" height="60" rx="20"/>
      </g>
      <g text-anchor="middle">
        <text x="760" y="63" font-size="14" font-weight="600" fill="#2d3142">Never delete: cancel by its own flag</text>
        <text x="760" y="84" font-size="11" font-family="Consolas, monospace" fill="#4f5d75">receipt · payment · registry · title · signed doc · log</text>
        <text x="760" y="213" font-size="14" font-weight="600" fill="#2d3142">User runs that screen, no patch</text>
        <text x="760" y="234" font-size="11" font-family="Consolas, monospace" fill="#4f5d75">e.g. Batal Perserahan · Pembatalan Lesen</text>
        <text x="760" y="344" font-size="14" font-weight="600" fill="#2d3142">Cancel by status or set inactive</text>
        <text x="760" y="363" font-size="11" font-family="Consolas, monospace" fill="#4f5d75">only after all 4 proofs pass:</text>
      </g>
      <g font-size="12" fill="#2d3142">
        <text x="584" y="388">1. the screens and lookups read it (code)</text>
        <text x="584" y="410">2. the app's own cancel writes it (analog)</text>
        <text x="584" y="432">3. nothing sets it back later (no override)</text>
        <text x="584" y="454">4. a row already in that state is hidden</text>
        <text x="600" y="472">on screen today (DB + screen)</text>
      </g>
      <g text-anchor="middle">
        <text x="760" y="573" font-size="14" font-weight="600" fill="#2d3142">DELETE is fine</text>
        <text x="760" y="594" font-size="11" font-family="Consolas, monospace" fill="#4f5d75">0-row child count SELECT above it</text>
        <text x="270" y="716" font-size="14" font-weight="600" fill="#2d3142">Unsure: unlink</text>
        <text x="270" y="736" font-size="11" font-family="Consolas, monospace" fill="#4f5d75">on PROD, stop and ask</text>
      </g>

      <g font-family="Consolas, monospace" font-size="11" fill="#4f5d75"><text x="40" y="790">the gate denies: DELETE on a listed proof table,</text><text x="40" y="808">DELETE with no WHERE, TRUNCATE, and any other</text><text x="40" y="826">DELETE with no 0-row SELECT above it</text></g>
      <rect x="480" y="660" width="480" height="168" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="686" font-size="13" font-weight="600" fill="#2d3142">288625: No Serahan 02MH1579/2026</text>
      <text x="500" y="708" font-size="12" fill="#4f5d75">a perserahan already numbered = a record</text>
      <text x="500" y="728" font-size="12" fill="#4f5d75">Batal Perserahan screen reaches it:</text>
      <text x="500" y="748" font-size="12" fill="#4f5d75">Kemasukan Maklumat · unit 598 · fail PPTPB/2026/5</text>
      <text x="500" y="772" font-size="12" font-weight="600" fill="#2d3142">so the PDT user cancels it on screen, no patch</text>
      <text x="500" y="796" font-size="12" fill="#4f5d75">proven on PROD: 2,379 cancelled perserahan since 2025</text>
      <text x="500" y="814" font-size="12" fill="#4f5d75">were followed by a new one on the same title</text>
    </svg>
  </div>
</body>
</html>
